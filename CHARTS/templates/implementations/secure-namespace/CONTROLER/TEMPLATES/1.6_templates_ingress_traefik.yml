# ConfigMap 6 - Traefik Ingress Controller
apiVersion: v1
kind: ConfigMap
metadata:
  name: templates-ingress-traefik
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "secure-namespace-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: deployment-template

data:
  deployment.yaml: |
    [% if spec.ingress.enabled and spec.ingress.controller.type == 'traefik' %]
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: [{ namespace_name }]-traefik-ingress-controller
      namespace: [{ namespace_name }]
      labels:
        {{ .Values.crd.group }}/solution: [{ solution }]
        {{ .Values.crd.group }}/environment: [{ environment }]
        app: ingress-controller
        ingress-type: traefik
    spec:
      replicas: [{ spec.ingress.controller.replicas }]
      selector:
        matchLabels:
          app: [{ namespace_name }]-ingress-controller
      template:
        metadata:
          labels:
            app: [{ namespace_name }]-ingress-controller
        spec:
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: [{ spec.ingress.controller.nodeSelector.label }]
                        operator: In
                        values:
                          - [{ spec.ingress.controller.nodeSelector.value }]
          serviceAccountName: [{ namespace_name }]-ingress-traefik-sa
          containers:
          - name: traefik-ingress-controller
            image: traefik:v2.10
            args:
            # Providers
            - --providers.kubernetesingress=true
            - --providers.kubernetesingress.ingressclass=[{ namespace_name }]
            - --providers.kubernetesingress.namespaces=[{ namespace_name }]
            # Entrypoints
            - --entrypoints.web.address=:80
            - --entrypoints.websecure.address=:443
            - --entrypoints.websecure.http.tls=true
            - --entrypoints.traefik.address=:1024
            # API et Dashboard sur port 1024
            - --api=true
            - --api.dashboard=true
            - --api.insecure=true
            # Ping (pour health checks)
            - --ping=true
            - --ping.entrypoint=traefik
            # Logs
            - --log.level=INFO
            - --accesslog=true
            # Metrics (Prometheus)
            - --metrics.prometheus=true
            - --metrics.prometheus.entrypoint=traefik
            env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # DÉSACTIVER LE PROXY
            - name: HTTP_PROXY
              value: ""
            - name: HTTPS_PROXY
              value: ""
            - name: http_proxy
              value: ""
            - name: https_proxy
              value: ""
            - name: NO_PROXY
              value: "*"
            - name: no_proxy
              value: "*"
            resources:
              requests:
                cpu: [{ spec.ingress.controller.resources.requests.cpu }]
                memory: [{ spec.ingress.controller.resources.requests.memory }]
              limits:
                cpu: [{ spec.ingress.controller.resources.limits.cpu }]
                memory: [{ spec.ingress.controller.resources.limits.memory }]
            ports:
            - name: web
              containerPort: 80
              protocol: TCP
            - name: websecure
              containerPort: 443
              protocol: TCP
            - name: traefik
              containerPort: 1024
              protocol: TCP
            livenessProbe:
              httpGet:
                path: /ping
                port: 1024
                scheme: HTTP
              initialDelaySeconds: 10
              periodSeconds: 10
              timeoutSeconds: 1
            readinessProbe:
              httpGet:
                path: /ping
                port: 1024
                scheme: HTTP
              initialDelaySeconds: 10
              periodSeconds: 10
              timeoutSeconds: 1
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
                add:
                - NET_BIND_SERVICE
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              runAsUser: 65532
              runAsGroup: 65532
          volumes:
          - name: tmp
            emptyDir: {}
    [% else %]
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: [{ namespace_name }]-traefik-ingress-controller
      namespace: [{ namespace_name }]
    _action: delete
    ---
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: ingress-traefik-config
      namespace: [{ namespace_name }]
    _action: delete
    [% endif %]
  rbac.yaml: |
    [% if spec.ingress.enabled and spec.ingress.controller.type == 'traefik' %]
    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRole
    metadata:
      name: [{ namespace_name }]-ingress-traefik-controller
      labels:
        app.kubernetes.io/component: rbac
        app.kubernetes.io/name: ingress-traefik
    rules:
    # Permissions pour lire les ressources globales
    - apiGroups: [""]
      resources: ["services", "endpoints", "secrets"]
      verbs: ["get", "list", "watch"]
    - apiGroups: [""]
      resources: ["nodes"]
      verbs: ["get", "list", "watch"]
    # Permissions pour les ingresses
    - apiGroups: ["networking.k8s.io"]
      resources: ["ingresses", "ingressclasses"]
      verbs: ["get", "list", "watch"]
    - apiGroups: ["networking.k8s.io"]
      resources: ["ingresses/status"]
      verbs: ["update"]
    # Permissions pour les CRDs Traefik
    - apiGroups: ["traefik.io", "traefik.containo.us"]
      resources: ["*"]
      verbs: ["get", "list", "watch"]
    # Permissions pour les events
    - apiGroups: [""]
      resources: ["events"]
      verbs: ["create", "patch"]
    # Permissions pour les endpointslices
    - apiGroups: ["discovery.k8s.io"]
      resources: ["endpointslices"]
      verbs: ["list", "watch", "get"]
    ---
    # ServiceAccount local dans le namespace utilisateur
    apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: [{ namespace_name }]-ingress-traefik-sa
      namespace: [{ namespace_name }]
      labels:
        {{ .Values.crd.group }}/solution: [{ solution }]
        {{ .Values.crd.group }}/environment: [{ environment }]
        app.kubernetes.io/name: ingress-traefik
    ---
    # ClusterRoleBinding pour lier le SA local au ClusterRole global
    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    metadata:
      name: [{ namespace_name }]-ingress-traefik-binding
      labels:
        {{ .Values.crd.group }}/solution: [{ solution }]
        {{ .Values.crd.group }}/environment: [{ environment }]
        managed-namespace: [{ namespace_name }]
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: [{ namespace_name }]ingress-traefik-controller
    subjects:
    - kind: ServiceAccount
      name: [{ namespace_name }]-ingress-traefik-sa
      namespace: [{ namespace_name }]
    ---
    # Role local pour permissions namespacées
    apiVersion: rbac.authorization.k8s.io/v1
    kind: Role
    metadata:
      name: [{ namespace_name }]-ingress-traefik-role
      namespace: [{ namespace_name }]
      labels:
        {{ .Values.crd.group }}/solution: [{ solution }]
        {{ .Values.crd.group }}/environment: [{ environment }]
    rules:
    - apiGroups: [""]
      resources: ["events"]
      verbs: ["create", "patch"]
    - apiGroups: ["coordination.k8s.io"]
      resources: ["leases"]
      verbs: ["create", "get", "update", "list", "watch"]
    - apiGroups: [""]
      resources: ["configmaps"]
      verbs: ["create", "get", "update", "list", "watch"]
    - apiGroups: [""]
      resources: ["secrets"]
      verbs: ["get", "list", "watch"]
    - apiGroups: [""]
      resources: ["pods"]
      verbs: ["get", "list", "watch"]
    ---
    # RoleBinding local
    apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata:
      name: [{ namespace_name }]-ingress-traefik-binding
      namespace: [{ namespace_name }]
      labels:
        {{ .Values.crd.group }}/solution: [{ solution }]
        {{ .Values.crd.group }}/environment: [{ environment }]
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: Role
      name: [{ namespace_name }]-ingress-traefik-role
    subjects:
    - kind: ServiceAccount
      name: [{ namespace_name }]-ingress-traefik-sa
      namespace: [{ namespace_name }]
    [% else %]
    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRole
    metadata:
      name: [{ namespace_name }]ingress-traefik-controller
    _action: delete
    ---
    apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: [{ namespace_name }]-ingress-traefik-sa
      namespace: [{ namespace_name }]
    _action: delete
    ---
    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    metadata:
      name: [{ namespace_name }]-ingress-traefik-binding
    _action: delete
    ---
    apiVersion: rbac.authorization.k8s.io/v1
    kind: Role
    metadata:
      name: [{ namespace_name }]-ingress-traefik-role
      namespace: [{ namespace_name }]
    _action: delete
    ---
    apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata:
      name: [{ namespace_name }]-ingress-traefik-binding
      namespace: [{ namespace_name }]
    _action: delete
    ---
    [% endif %]
