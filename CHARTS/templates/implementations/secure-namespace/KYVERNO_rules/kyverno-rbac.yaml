# 11_kyverno-rbac.yml
# RBAC pour permettre à Kyverno d'accéder aux SecureNamespace CRD
# Nécessaire pour la génération de rapports de conformité (PolicyReports)
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno-securenamespace-access
  labels:
    {{- include "secure-namespace-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: kyverno-rbac
rules:
- apiGroups: ["{{ .Values.crd.group }}"]
  resources: ["{{ .Values.crd.plural }}"]
  verbs: ["get", "list", "watch"]
---
# Binding pour le reports-controller (génère les PolicyReports)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kyverno-reports-securenamespace-access
  labels:
    {{- include "secure-namespace-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: kyverno-rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kyverno-securenamespace-access
subjects:
- kind: ServiceAccount
  name: kyverno-reports-controller
  namespace: kyverno
---
# Binding pour le admission-controller (évalue les policies)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kyverno-admission-securenamespace-access
  labels:
    {{- include "secure-namespace-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: kyverno-rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kyverno-securenamespace-access
subjects:
- kind: ServiceAccount
  name: kyverno-admission-controller
  namespace: kyverno
---
# Binding pour le background-controller (évalue les policies en background)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kyverno-background-securenamespace-access
  labels:
    {{- include "secure-namespace-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: kyverno-rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kyverno-securenamespace-access
subjects:
- kind: ServiceAccount
  name: kyverno-background-controller
  namespace: kyverno