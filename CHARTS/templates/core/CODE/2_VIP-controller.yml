    #!/usr/bin/env python3
    """
    VIP Controller v6.0.6 - Fix initialized pour watchers

    CHANGEMENTS v6.0.6:
    - ⭐ GARDE self.initialized mais SEULEMENT pour les watchers
    - ⭐ Pas de logique métier basée sur initialized
    - ⭐ initialized devient un simple flag "premier événement traité"
    """

    import os
    import sys
    import time
    import logging
    import signal
    import copy
    import threading

    from datetime import datetime
    from kubernetes import client, config, watch
    from kubernetes.client.rest import ApiException

    from template_manager import TemplateManager
    from resource_manager import ResourceManager
    from job_manager import JobManager
    from node_finder import NodeFinder
    from config_loader import ConfigLoader

    # CRD piloté par le moteur générique (voir values.yaml::crd)
    CRD_GROUP = os.getenv('CRD_GROUP', 'secure-ns.example.com')
    CRD_VERSION = os.getenv('CRD_VERSION', 'v1alpha1')
    CRD_PLURAL = os.getenv('CRD_PLURAL', 'securenamespaces')

    logging.basicConfig(level=logging.INFO, format='%(asctime)s - %(levelname)s - %(message)s')
    logger = logging.getLogger(__name__)

    LABEL_NODE_NAME = "egress-vip.io/node"
    LABEL_VIP = "egress-vip.io/vip"
    LABEL_LAST_UPDATE = "egress-vip.io/last-update"
    LABEL_SERVICE_NAME = "egress-vip.io/service-name"


    class VIPController:
        def __init__(self):
            config.load_incluster_config()
            self.operator_namespace = os.getenv("NAMESPACE", "namespace-operator")
            self.deployment_name = os.getenv("DEPLOYMENT_NAME")
            securenamespace_name = os.getenv("SECURENAMESPACE_NAME")

            if not securenamespace_name or not self.deployment_name:
                raise ValueError("SECURENAMESPACE_NAME and DEPLOYMENT_NAME required")

            self.config_loader = ConfigLoader(securenamespace_name)
            if not self.config_loader.load_securenamespace():
                raise ValueError(f"Cannot load SecureNamespace")

            # ⭐ GARANTIE: Toujours un dict
            self.previous_spec = {}
            self.previous_vip = None
            self.previous_node = None

            self._reconcile_lock = threading.Lock()
            self._reconcile_pending = False


            self.config_loader.log_config()

            # ⭐ UN SEUL FLAG: initialized
            # Passe à True UNIQUEMENT quand jobs CRÉÉS (pas skipped)
            self.initialized = False
            
            self.running = True
            self.shutdown_mode = False

            self.api_client = client.ApiClient()
            self.core_v1 = client.CoreV1Api()
            self.apps_v1 = client.AppsV1Api()
            self.batch_v1 = client.BatchV1Api()
            self.custom_api = client.CustomObjectsApi()
            self.node_finder = NodeFinder(self.core_v1, self.custom_api)

            self.template_manager = TemplateManager(self.operator_namespace)
            self.resource_manager = ResourceManager(self.api_client)
            self.job_manager = JobManager(
                self.template_manager, self.resource_manager,
                self.batch_v1, self.core_v1, self.operator_namespace
            )

            logger.info("=== VIP Controller v6.1.0 - Simplified ===")
            logger.info(f"   Deployment: {self.deployment_name}")
            logger.info(f"   SecureNamespace: {securenamespace_name}")


        def reload_config_if_changed(self, context=""):
            try:
                old_version = self.config_loader.get_resource_version()
                if self.config_loader.has_changed():
                    logger.info(f"🔄 [{context}] Config change detected!")
                    logger.info(f"   Old version: {old_version}")
                    if self.config_loader.reload():
                        new_version = self.config_loader.get_resource_version()
                        logger.info(f"   New version: {new_version}")
                        logger.info(f"✅ [{context}] Configuration reloaded")
                        self.config_loader.log_config()
                        return True
                    else:
                        logger.warning(f"⚠️  [{context}] Reload failed")
                        return False
                else:
                    logger.debug(f"🔄 [{context}] Config unchanged (version: {old_version})")
                    return False
            except Exception as e:
                logger.error(f"❌ Error reloading config: {e}")
                return False

        def run(self):
            """
            ⭐ v6.1.0 SIMPLIFIÉ: Plus de self.initialized = True ici !
            """
            signal.signal(signal.SIGTERM, lambda s, f: setattr(self, 'running', False))
            signal.signal(signal.SIGINT, lambda s, f: setattr(self, 'running', False))

            try:
                self.reload_config_if_changed("STARTUP")
                
                # ⭐ Initialiser previous_spec
                values = self.config_loader.get_values()
                current_spec = values.get('spec', {})
                if current_spec:
                    import copy
                    self.previous_spec = copy.deepcopy(current_spec)
                    logger.info(f"✅ previous_spec initialized")
                
                templates = self.template_manager.load_templates_order()
                if not templates:
                    raise Exception("No templates")

                # Première reconciliation
                logger.info("🚀 Initial reconciliation...")
                self.reconcile()
                
                if not self.running:
                    return

                # ⭐ SUPPRIMÉ: self.initialized = True
                # Maintenant posé dans reconcile() quand jobs créés !
                
                # Démarrer watchers
                import threading
                logger.info("👀 Starting watchers...")
                threading.Thread(target=self._watch_own_deployment, daemon=True).start()
                threading.Thread(target=self._watch_endpoints, daemon=True).start()
                threading.Thread(target=self._watch_service, daemon=True).start()
                threading.Thread(target=self._watch_securenamespace, daemon=True).start()

                # Réconciliation périodique
                threading.Thread(target=self._periodic_reconcile, daemon=True).start()

                with open('/tmp/healthy', 'w') as f:
                    f.write('ok')

                logger.info("✅ Controller started")

                while self.running:
                    time.sleep(1)
                    if self.shutdown_mode:
                        active_finalizers = self.resource_manager.get_active_finalizers()
                        if not active_finalizers:
                            logger.info("=" * 60)
                            logger.info("✅ All finalizers removed - Safe to shutdown")
                            logger.info("=" * 60)
                            break
                        else:
                            logger.debug(f"⏳ {len(active_finalizers)} finalizer(s) remaining")

            except Exception as e:
                logger.error(f"❌ Fatal: {e}", exc_info=True)
                sys.exit(1)
            finally:
                try:
                    os.remove('/tmp/healthy')
                except:
                    pass
                logger.info("👋 Controller exiting gracefully")

        def _watch_securenamespace(self):
            """
            ⭐ v6.1.0 FINAL: Watcher avec previous_spec - Pattern propre
            
            CYCLE PROPRE:
            1. Stocke previous_spec AVANT reconciliation
            2. Déclenche reconciliation
            3. Met à jour previous_spec = current_spec APRÈS reconciliation
            
            → egress_changed est True UNIQUEMENT lors du changement effectif
            """
            logger.info("👀 Watching SecureNamespace for spec changes...")
            resource_version = self.config_loader.get_resource_version()
            
            # ⭐ Initialiser avec spec actuel (pas None)
            values = self.config_loader.get_values()
            import copy
            previous_spec = copy.deepcopy(values.get('spec', {}))

            while self.running:
                try:
                    w = watch.Watch()
                    for event in w.stream(
                        self.custom_api.list_cluster_custom_object,
                        group=CRD_GROUP,
                        version=CRD_VERSION,
                        plural=CRD_PLURAL,
                        field_selector=f"metadata.name={self.config_loader.securenamespace_name}",
                        resource_version=resource_version,
                        timeout_seconds=300
                    ):
                        event_type = event['type']
                        obj = event['object']
                        
                        # Mettre à jour la resource version
                        if hasattr(obj, 'get'):
                            new_version = obj.get('metadata', {}).get('resourceVersion')
                            if new_version:
                                resource_version = new_version
                        
                        if event_type == 'MODIFIED':
                            logger.info("🔔 SecureNamespace MODIFIED detected")
                            
                            # Extraire le spec actuel
                            current_spec = obj.get('spec', {})
                            
                            # ⭐ ÉTAPE 1: Stocker previous_spec pour la reconciliation
                            # (None au premier event, puis le spec de l'event précédent)
                            self.previous_spec = previous_spec
                            
                            # ⭐ ÉTAPE 2: Recharger config et réconcilier
                            if self.reload_config_if_changed("WATCH_SECURENAMESPACE"):
                                logger.info("🔄 Triggering reconciliation...")
                                self.reconcile()
                            
                            # ⭐ ÉTAPE 3: Mettre à jour previous_spec APRÈS reconciliation
                            # Le current_spec devient le nouveau previous_spec
                            if current_spec:
                                import copy
                                previous_spec = copy.deepcopy(current_spec)
                                # ⭐ Sync avec l'instance pour les autres watchers
                                self.previous_spec = previous_spec
                            else:
                                previous_spec = {}
                                self.previous_spec = {}
                        
                        elif event_type == 'DELETED':
                            logger.warning("⚠️  SecureNamespace DELETED")
                            self.running = False
                            break
                
                except Exception as e:
                    logger.error(f"❌ Error watching SecureNamespace: {e}")
                    # ⭐ Reset resourceVersion sur 410 pour repartir du début
                    if '410' in str(e):
                        resource_version = None
                    time.sleep(10)

        def _watch_own_deployment(self):
            logger.info("👀 Watching own Deployment for deletion...")
            while self.running:
                try:
                    deploy = self.apps_v1.read_namespaced_deployment(
                        name=self.deployment_name,
                        namespace=self.operator_namespace
                    )
                    if deploy.metadata.deletion_timestamp:
                        if not self.shutdown_mode:
                            logger.warning("=" * 60)
                            logger.warning("⚠️  DELETION DETECTED - Entering shutdown mode")
                            logger.warning("=" * 60)
                            self.shutdown_mode = True
                            self.reload_config_if_changed("SHUTDOWN_MODE")
                            try:
                                logger.info("🔄 Running shutdown reconciliation...")
                                self.reconcile()
                            except Exception as e:
                                logger.error(f"Error during shutdown reconciliation: {e}")
                    time.sleep(5)
                except ApiException as e:
                    if e.status == 404:
                        logger.info("Deployment deleted")
                        self.running = False
                        break
                    else:
                        logger.warning(f"Error watching deployment: {e}")
                        time.sleep(10)
                except Exception as e:
                    logger.error(f"Unexpected error in watch: {e}")
                    if '410' in str(e):
                        resource_version = None
                    time.sleep(10)

        def _watch_endpoints(self):
            logger.info("👀 Watching Endpoints for changes...")
            resource_version = None
            while self.running:
                try:
                    self.reload_config_if_changed("WATCH_ENDPOINTS_INIT")
                    values = self.config_loader.get_values()
                    namespace_name = values.get('namespace_name')
                    watched_service = values.get('spec', {}).get('ingress', {}).get('serviceName', 'lb-gateway')
                    kwargs = {
                        'namespace': namespace_name,
                        'field_selector': f"metadata.name={watched_service}",
                        'timeout_seconds': 300
                    }
                    if resource_version:
                        kwargs['resource_version'] = resource_version
                    w = watch.Watch()
                    for event in w.stream(self.core_v1.list_namespaced_endpoints, **kwargs):
                        event_type = event['type']
                        obj = event['object']
                        if hasattr(obj.metadata, 'resource_version'):
                            resource_version = obj.metadata.resource_version
                        if event_type == 'ADDED' and resource_version and self.initialized:
                            continue
                        if event_type in ['ADDED', 'MODIFIED']:
                            logger.info(f"🔔 Endpoints {event_type}")
                            self.reload_config_if_changed("WATCH_ENDPOINTS")
                            self.reconcile()
                except Exception as e:
                    logger.error(f"❌ Endpoints watcher error: {e}")
                    if '410' in str(e):
                        resource_version = None
                    time.sleep(10)

        def _watch_service(self):
            logger.info("👀 Watching Service for changes...")
            resource_version = None
            while self.running:
                try:
                    self.reload_config_if_changed("WATCH_SERVICE_INIT")
                    values = self.config_loader.get_values()
                    namespace_name = values.get('namespace_name')
                    watched_service = values.get('spec', {}).get('ingress', {}).get('serviceName', 'lb-gateway')
                    kwargs = {
                        'namespace': namespace_name,
                        'field_selector': f"metadata.name={watched_service}",
                        'timeout_seconds': 300
                    }
                    if resource_version:
                        kwargs['resource_version'] = resource_version
                    w = watch.Watch()
                    for event in w.stream(self.core_v1.list_namespaced_service, **kwargs):
                        event_type = event['type']
                        obj = event['object']
                        if hasattr(obj.metadata, 'resource_version'):
                            resource_version = obj.metadata.resource_version
                        if event_type == 'ADDED' and resource_version and self.initialized:
                            continue
                        if event_type in ['ADDED', 'MODIFIED']:
                            logger.info(f"🔔 Service {event_type}")
                            self.reload_config_if_changed("WATCH_SERVICE")
                            self.reconcile()
                except Exception as e:
                    logger.error(f"❌ Service watcher error: {e}")
                    if '410' in str(e):
                        resource_version = None
                    time.sleep(10)

        def _periodic_reconcile(self):
            while self.running:
                self.reload_config_if_changed("PERIODIC_CHECK")
                values = self.config_loader.get_values()
                interval = values.get('spec', {}).get('egressController', {}).get('reconcileIntervalSeconds', 30)
                time.sleep(interval)
                if not self.running:
                    break
                try:
                    logger.info("🔄 Periodic reconciliation")
                    self.reload_config_if_changed("PERIODIC_RECONCILE")
                    self.reconcile()
                except Exception as e:
                    logger.error(f"Reconciliation error: {e}")

        def reconcile(self):
            # Si un reconcile tourne déjà, marquer pending et sortir
            if not self._reconcile_lock.acquire(blocking=False):
                logger.info("⏳ Reconcile already running, marking pending...")
                self._reconcile_pending = True
                return

            try:
                self._do_reconcile()
                
                # Si un reconcile était en attente, le jouer maintenant
                while self._reconcile_pending:
                    self._reconcile_pending = False
                    logger.info("🔄 Running pending reconcile...")
                    self._do_reconcile()
            finally:
                self._reconcile_lock.release()


        def _do_reconcile(self):
            """
            VIP Controller v6.1.1 - previous_vip + previous_node
            """
            try:
                config_changed = self.reload_config_if_changed("RECONCILE_START")
                if config_changed:
                    logger.info("📋 Working with FRESH configuration")

                if self.shutdown_mode:
                    logger.info("━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━")
                    logger.info("🔄 SHUTDOWN MODE - Template-based reconciliation")
                else:
                    logger.info("━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━")
                    logger.info("🔄 RECONCILIATION")
                    logger.info("━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━")

                values = self.config_loader.get_values()
                namespace_name = values.get('namespace_name')
                spec = values.get('spec', {})
                watched_service = spec.get('ingress', {}).get('serviceName', 'lb-gateway')

                # ⭐ ÉTAPE 1: Capturer previous AVANT tout
                previous_vip = self.previous_vip
                previous_node = self.previous_node

                # ⭐ ÉTAPE 2: Récupérer VIP actuelle
                vip = self._get_vip_from_service(namespace_name, watched_service)

                # ⭐ ÉTAPE 3: Récupérer last_vip/last_node depuis labels namespace
                last_vip, last_node = self._get_last_state_from_namespace(namespace_name)

                # ═══════════════════════════════════════════════════════════
                # CAS 1: Pas de VIP
                # ═══════════════════════════════════════════════════════════
                if not vip:
                    logger.info("⏳ No VIP yet")

                    template_values = self.build_template_values(
                        node_name=None,
                        vip=None,
                        last_vip=last_vip,
                        last_node=last_node,
                        previous_vip=previous_vip,
                        previous_node=previous_node,
                    )

                    self.job_manager.execute_all_jobs(template_values)
                    self.apply_templates(template_values)

                    self.previous_vip = None
                    self.previous_node = None
                    self.previous_spec = copy.deepcopy(spec)
                    return


                # ═══════════════════════════════════════════════════════════
                # CAS 2: VIP existe
                # ═══════════════════════════════════════════════════════════
                logger.info(f"✅ VIP:          {vip}")
                logger.info(f"✅ previous_vip: {previous_vip}")
                logger.info(f"✅ last_vip:     {last_vip}")
                logger.info(f"✅ initialized:  {self.initialized}")

                node_name = self.node_finder.find_node_hosting_vip(values)
                logger.info(f"✅ Node:          {node_name}")
                logger.info(f"✅ previous_node: {previous_node}")
                logger.info(f"✅ last_node:     {last_node}")

                # ⭐ ÉTAPE 4: Build values avec TOUTES les variables d'état
                template_values = self.build_template_values(
                    node_name=node_name,
                    vip=vip,
                    last_vip=last_vip,
                    last_node=last_node,
                    previous_vip=previous_vip,
                    previous_node=previous_node,
                )


                self._log_template_values_if_debug(template_values)

                # ⭐ ÉTAPE 5: Execute jobs
                result = self.job_manager.execute_all_jobs(template_values)

                if len(result['created']) > 0:
                    if not self.initialized:
                        logger.info("✅ Jobs created, initialized = True")
                    self.initialized = True

                # ⭐ ÉTAPE 6: Update labels namespace APRÈS jobs
                if vip and node_name:
                    self._update_namespace_labels(namespace_name, watched_service, node_name, vip)

                # ⭐ ÉTAPE 7: Apply templates
                self.apply_templates(template_values)

                # ⭐ ÉTAPE 8: Mettre à jour previous APRÈS tout
                self.previous_vip = vip
                self.previous_node = node_name
                self.previous_spec = copy.deepcopy(spec)  # ⭐ ajout

                if self.shutdown_mode:
                    active = self.resource_manager.get_active_finalizers()
                    logger.info(f"🔒 Finalizers remaining: {len(active)}")
                else:
                    logger.info("🎉 Reconciliation complete")

            except Exception as e:
                logger.error(f"❌ Error: {e}", exc_info=True)
                raise

        def _log_template_values_if_debug(self, values):
            """⭐ Affiche les values UNE SEULE FOIS si DEBUG_VALUES=true"""
            debug_enabled = os.getenv('DEBUG_VALUES', 'false').lower() == 'true'
            if not debug_enabled:
                return
            
            logger.info("=" * 70)
            logger.info("🐛 DEBUG: Template Values for This Reconciliation")
            logger.info("=" * 70)
            
            for key in sorted(values.keys()):
                value = values[key]
                if isinstance(value, dict):
                    logger.info(f"   {key}:")
                    items = list(value.items())
                    for subkey, subval in items[:5]:
                        logger.info(f"      {subkey}: {subval}")
                    if len(value) > 5:
                        logger.info(f"      ... and {len(value) - 5} more keys")
                elif isinstance(value, list):
                    logger.info(f"   {key}: [")
                    for item in value[:5]:
                        logger.info(f"      {item}")
                    if len(value) > 5:
                        logger.info(f"      ... and {len(value) - 5} more items")
                    logger.info(f"   ]")
                elif isinstance(value, str):
                    if len(value) > 100:
                        logger.info(f"   {key}: '{value[:100]}...'")
                    else:
                        logger.info(f"   {key}: '{value}'")
                else:
                    logger.info(f"   {key}: {value}")
            
            logger.info("=" * 70)
            logger.info("")

        def _get_last_state_from_namespace(self, namespace_name):
            """
            ⭐ v6.0.5: Récupère l'état précédent depuis les labels du namespace
            
            Returns:
                tuple: (last_vip, last_node)
            """
            try:
                ns = self.core_v1.read_namespace(name=namespace_name)
                labels = ns.metadata.labels or {}
                
                last_vip = labels.get(LABEL_VIP, '')
                last_node = labels.get(LABEL_NODE_NAME, '')
                
                return last_vip, last_node
                
            except ApiException as e:
                if e.status == 404:
                    # Namespace pas encore créé
                    return '', ''
                else:
                    logger.warning(f"⚠️  Error reading namespace labels: {e}")
                    return '', ''

        def build_template_values(self, node_name, vip, last_vip=None, last_node=None,
                           previous_vip=None, previous_node=None):
            timestamp = datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ")
            values = self.config_loader.get_values()
            spec = values.get('spec', {})
            namespace_name = values.get('namespace_name')

            is_first_run = (not last_vip or last_vip == '' or last_vip == 'None')
            # ⭐ Tous les changements calculés ici
            vip_changed = (vip != previous_vip)
            node_changed = (node_name != previous_node)

            current_egress = spec.get('egressController', {}).get('enabled', False)
            previous_egress = self.previous_spec.get('egressController', {}).get('enabled', False)
            egress_changed = (current_egress != previous_egress)

            current_ingress = spec.get('ingress', {}).get('enabled', False)
            previous_ingress = self.previous_spec.get('ingress', {}).get('enabled', False)
            ingress_changed = (current_ingress != previous_ingress)

            return {
                # ═══════════════════════════════════════
                # Identité
                # ═══════════════════════════════════════
                'securenamespace_name': values.get('securenamespace_name'),
                'namespace_name':       namespace_name,
                'solution':             values.get('solution'),
                'environment':          values.get('environment'),
                'operator_namespace':   self.operator_namespace,

                # ═══════════════════════════════════════
                # Spec
                # ═══════════════════════════════════════
                'spec':                 spec,
                'previous_spec':        self.previous_spec,

                # ═══════════════════════════════════════
                # VIP / Node - état courant
                # ═══════════════════════════════════════
                'egress_ip':            vip,
                'node_name':            node_name,

                # ═══════════════════════════════════════
                # VIP / Node - état précédent (cycle N-1, peut être None)
                # ═══════════════════════════════════════
                'previous_vip':         previous_vip,
                'previous_node':        previous_node,

                # ═══════════════════════════════════════
                # VIP / Node - dernière valeur connue (jamais None après premier run)
                # ═══════════════════════════════════════
                'last_vip':             last_vip,
                'last_node':            last_node,

                # ═══════════════════════════════════════
                # Flags de changement
                # ═══════════════════════════════════════
                'vip_changed':          vip_changed,
                'node_changed':         node_changed,
                'egress_changed':       egress_changed,
                'ingress_changed':      ingress_changed,

                # ═══════════════════════════════════════
                # Flags d'état
                # ═══════════════════════════════════════
                'is_first_run':         is_first_run,
                'initialized':          self.initialized,
                'shutdown_mode':        self.shutdown_mode,

                # ═══════════════════════════════════════
                # Infos réseau
                # ═══════════════════════════════════════
                'eligible_nodes':       self.node_finder.get_eligible_nodes(values),
                'l2_policy_name':       values.get('l2_policy_name'),
                'egress_policy_name':   values.get('egress_policy_name'),
                'domain':               values.get('domain'),

                # ═══════════════════════════════════════
                # Divers
                # ═══════════════════════════════════════
                'timestamp':            timestamp,
            }

        def apply_templates(self, values):
            """⭐ v6.0.3: Application avec icônes et résumé détaillé"""
            logger.info("📄 Applying templates...")
            templates_order = self.template_manager.load_templates_order()
            if not templates_order:
                logger.warning("⚠️  No templates to apply")
                return {'applied': [], 'deleted': [], 'failed': []}
            
            templates_content = self.template_manager.load_templates(templates_order)
            results = {'applied': [], 'deleted': [], 'skipped': [], 'failed': []}

            for i, template_name in enumerate(templates_order, 1):
                try:
                    if template_name not in templates_content:
                        logger.warning(f"   [{i}/{len(templates_order)}] ⚠️  {template_name}: Not loaded")
                        results['failed'].append({'template': template_name, 'reason': 'Template not found'})
                        continue
                    
                    docs = self.template_manager.render_to_documents(template_name, values)
                    
                    if not docs:
                        logger.info(f"   [{i}/{len(templates_order)}] ⏭️  {template_name}")
                        results['skipped'].append(template_name)
                        continue
                    
                    # Déterminer l'icône
                    actions = [doc.get('_action', 'apply') for doc in docs if doc]
                    delete_count = actions.count('delete')
                    apply_count = len(actions) - delete_count
                    
                    if delete_count > 0 and apply_count == 0:
                        icon = "🗑️"
                    elif apply_count > 0 and delete_count == 0:
                        icon = "✅"
                    else:
                        icon = "🔀"
                    
                    logger.info(f"   [{i}/{len(templates_order)}] {icon} {template_name}")
                    
                    for doc_idx, doc in enumerate(docs, 1):
                        if not doc:
                            continue
                        action = doc.get('_action', 'apply')
                        kind = doc.get('kind')
                        name = doc.get('metadata', {}).get('name')
                        namespace = doc.get('metadata', {}).get('namespace', '')

                        try:
                            self.resource_manager.apply_or_delete(doc, template_name)
                            resource_key = f"{kind}/{name}"
                            if namespace:
                                resource_key = f"{namespace}/{resource_key}"
                            if action == 'delete':
                                results['deleted'].append({'template': template_name, 'resource': resource_key})
                                logger.debug(f"      [{doc_idx}] 🗑️  {resource_key}")
                            else:
                                results['applied'].append({'template': template_name, 'resource': resource_key})
                                logger.debug(f"      [{doc_idx}] ✅ {resource_key}")
                        except Exception as e:
                            logger.error(f"      [{doc_idx}] ❌ {e}")
                            results['failed'].append({
                                'template': template_name,
                                'resource': f"{kind}/{name}",
                                'error': str(e)
                            })
                except Exception as e:
                    logger.error(f"   [{i}/{len(templates_order)}] ❌ {template_name}: {e}")
                    results['failed'].append({'template': template_name, 'error': str(e)})

            # Résumé
            applied_count = len(results['applied'])
            deleted_count = len(results['deleted'])
            skipped_count = len(results['skipped'])
            failed_count = len(results['failed'])
            
            logger.info(f"✅ {applied_count} applied, {deleted_count} deleted, {skipped_count} skipped")
            
            if failed_count > 0:
                logger.warning(f"⚠️  {failed_count} failed:")
                for failure in results['failed'][:5]:
                    if 'resource' in failure:
                        logger.warning(f"   - {failure['template']}/{failure['resource']}: {failure.get('error', 'unknown')}")
                    else:
                        logger.warning(f"   - {failure['template']}: {failure.get('error', 'unknown')}")
            
            # Statistiques seulement en DEBUG
            if logger.isEnabledFor(logging.DEBUG):
                if hasattr(self.template_manager, 'log_stats'):
                    self.template_manager.log_stats()
            
            return results

        def _get_vip_from_service(self, namespace_name, service_name):
            """Récupère la VIP depuis le Service LoadBalancer"""
            try:
                svc = self.core_v1.read_namespaced_service(
                    name=service_name, namespace=namespace_name
                )
                if svc.spec.load_balancer_ip:
                    return svc.spec.load_balancer_ip
                if svc.status.load_balancer and svc.status.load_balancer.ingress:
                    for ingress in svc.status.load_balancer.ingress:
                        if ingress.ip:
                            return ingress.ip
                if svc.metadata.annotations:
                    vip = svc.metadata.annotations.get("io.cilium/lb-ipam-ips")
                    if vip:
                        return vip
                return None
            except ApiException as e:
                if e.status == 404:
                    return None
                raise

        def _update_namespace_labels(self, namespace_name, watched_service, node_name, vip):
            """Met à jour les labels du namespace"""
            try:
                ns = self.core_v1.read_namespace(name=namespace_name)
                if not ns.metadata.labels:
                    ns.metadata.labels = {}
                ns.metadata.labels[LABEL_NODE_NAME] = node_name
                ns.metadata.labels[LABEL_VIP] = vip
                ns.metadata.labels[LABEL_SERVICE_NAME] = watched_service
                ns.metadata.labels[LABEL_LAST_UPDATE] = datetime.utcnow().strftime("%Y-%m-%dT%H-%M-%SZ")
                self.core_v1.patch_namespace(name=namespace_name, body=ns)
            except Exception as e:
                logger.warning(f"⚠️  Error updating labels: {e}")


    if __name__ == "__main__":
        controller = VIPController()
        controller.run()        
