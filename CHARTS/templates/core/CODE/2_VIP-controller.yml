# VIP Controller v6.0 - ConfigMap Python Code COMPLET
# Architecture Template-Centric avec détection de changements
#
# CHANGEMENTS v6.0:
# - ⭐ Passe last_vip et last_node aux templates
# - ⭐ Les templates décident de TOUTE la logique métier
# - ⭐ Zéro if/else métier dans le controller Python
# - ⭐ Jobs et templates lus depuis templates-order.yaml
# - ⭐ Exécution systématique à chaque reconcile
#
# MODULES:
#   config_loader.py    → Charge config + détecte changements
#   controller.py       → Orchestrateur simple (observe + délègue)
#   job_manager.py      → Exécute jobs depuis templates
#   node_finder.py      → Trouve node hébergeant VIP
#   resource_manager.py → SSA + finalizers
#   template_manager.py → Charge et rend templates Jinja2
#   requirements.txt    → Dépendances Python
#
# Compatible avec templates Jobs v6.1 (cleanup préventif à l'init)
#
apiVersion: v1
kind: ConfigMap
metadata:
  name: vip-controller-python-code
  namespace: {{ .Release.Namespace }} 
  labels:
    {{- include "secure-namespace-operator.labels" . | nindent 4 }}
    app.kubernetes.io/name: vip-controller
    app.kubernetes.io/version: "6.0"
    app.kubernetes.io/component: python-code
    app.kubernetes.io/managed-by: secure-namespace-operator
