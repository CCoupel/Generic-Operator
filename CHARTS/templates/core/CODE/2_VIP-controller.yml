    #!/usr/bin/env python3
    """
    Config Loader v6.0 - Charge config depuis CRD SecureNamespace
    Détecte les changements pour passer last_vip/last_node aux templates
    """
    import os
    import logging
    import json
    import kubernetes
    from kubernetes import client

    # CRD piloté par le moteur générique (voir values.yaml::crd)
    CRD_GROUP = os.getenv('CRD_GROUP', 'secure-ns.example.com')
    CRD_VERSION = os.getenv('CRD_VERSION', 'v1alpha1')
    CRD_PLURAL = os.getenv('CRD_PLURAL', 'securenamespaces')

    logger = logging.getLogger(__name__)


    def deep_merge(base, override):
        """Merge récursif de deux dictionnaires"""
        result = base.copy()
        for key, value in override.items():
            if key in result and isinstance(result[key], dict) and isinstance(value, dict):
                result[key] = deep_merge(result[key], value)
            else:
                result[key] = value
        return result


    def extract_defaults_recursive_dict(schema):
        """Extrait récursivement les valeurs par défaut d'un schema"""
        if not isinstance(schema, dict):
            return {}
        if 'default' in schema and schema['default'] is not None:
            return schema['default']
        if schema.get('type') == 'object' and 'properties' in schema:
            result = {}
            for prop_name, prop_schema in schema['properties'].items():
                prop_default = extract_defaults_recursive_dict(prop_schema)
                if prop_default is not None and prop_default != {}:
                    result[prop_name] = prop_default
            return result if result else {}
        return {}


    def extract_defaults_from_crd():
        """Charge le CRD et extrait les defaults depuis le schéma OpenAPI v3"""
        try:
            api = client.ApiextensionsV1Api()
            crd = api.read_custom_resource_definition(name=f'{CRD_PLURAL}.{CRD_GROUP}')
            schema_obj = crd.spec.versions[0].schema.open_apiv3_schema
            schema_dict = schema_obj.to_dict() if hasattr(schema_obj, 'to_dict') else schema_obj
            spec_schema = schema_dict.get('properties', {}).get('spec', {})
            defaults = extract_defaults_recursive_dict(spec_schema)
            return defaults if defaults else {}
        except Exception as e:
            logger.warning(f"⚠️  Impossible d'extraire les defaults du CRD: {e}")
            return {}


    def apply_defaults_to_spec(spec):
        """Applique les valeurs par défaut du CRD au spec fourni"""
        defaults = extract_defaults_from_crd()
        return deep_merge(defaults, spec)


    def extract_namespace_info(spec):
        """Extrait les informations de namespace depuis le spec"""
        solution = spec.get('project', {}).get('solution', 'default')
        environment = spec.get('project', {}).get('environment', 'dev').lower()
        namespace_name = spec.get('namespaceName')
        if not namespace_name:
            namespace_name = f"{solution}-{environment}"
        return solution, environment, namespace_name


    def get_template_values(spec, securenamespace_name, operator_namespace):
        """Construit le dictionnaire de valeurs pour le rendu des templates"""
        complete_spec = apply_defaults_to_spec(spec)
        solution, environment, namespace_name = extract_namespace_info(complete_spec)

        ingress_config = complete_spec.get('ingress', {})
        ingress_domain = ingress_config.get('domain', '')
        if ingress_domain:
            domain = f"{environment}.{solution}.{ingress_domain}"
        else:
            domain = f"{environment}.{solution}.local"

        return {
            'spec': complete_spec,
            'solution': solution,
            'environment': environment,
            'namespace_name': namespace_name,
            'securenamespace_name': securenamespace_name,
            'operator_namespace': operator_namespace,
            'l2_policy_name': f"{namespace_name}-l2-policy",
            'egress_policy_name': f"{namespace_name}-egress",
            'domain': domain,
        }


    class ConfigLoader:
        """Charge la configuration complète depuis le CRD SecureNamespace"""

        def __init__(self, securenamespace_name):
            self.securenamespace_name = securenamespace_name
            self.operator_namespace = os.getenv('NAMESPACE', 'namespace-operator')
            self._spec = None
            self._resource_version = None
            self._values = None
            self.custom_api = client.CustomObjectsApi()

            logger.info(f"📦 ConfigLoader initialized for {securenamespace_name}")

        def load_securenamespace(self):
            """Charge le SecureNamespace depuis l'API Kubernetes"""
            try:
                resource = self.custom_api.get_cluster_custom_object(
                    group=CRD_GROUP, version=CRD_VERSION,
                    plural=CRD_PLURAL, name=self.securenamespace_name
                )

                self._spec = resource.get('spec', {})
                self._resource_version = resource.get('metadata', {}).get('resourceVersion')
                self._values = get_template_values(
                    self._spec, self.securenamespace_name, self.operator_namespace
                )

                return True

            except Exception as e:
                logger.error(f"❌ Cannot load SecureNamespace '{self.securenamespace_name}': {e}")
                return False

        def get_values(self):
            """Retourne les valeurs pour les templates"""
            if self._values is None:
                self.load_securenamespace()
            return self._values or {}

        def get_resource_version(self):
            """Retourne la resourceVersion actuelle"""
            return self._resource_version

        def has_changed(self):
            """Vérifie si le SecureNamespace a changé"""
            try:
                resource = self.custom_api.get_cluster_custom_object(
                    group=CRD_GROUP, version=CRD_VERSION,
                    plural=CRD_PLURAL, name=self.securenamespace_name
                )
                new_version = resource.get('metadata', {}).get('resourceVersion')
                return new_version != self._resource_version
            except:
                return False

        def reload(self):
            """Recharge le SecureNamespace"""
            old_version = self._resource_version
            self.load_securenamespace()
            return self._resource_version != old_version

        def log_config(self):
            """Log la configuration actuelle"""
            values = self.get_values()
            spec = values.get('spec', {})

            logger.info("=" * 60)
            logger.info("VIP Controller v6.0 - Configuration")
            logger.info("=" * 60)
            logger.info(f"SecureNamespace: {values.get('securenamespace_name')}")
            logger.info(f"Namespace: {values.get('namespace_name')}")
            logger.info(f"Solution: {values.get('solution')}")
            logger.info(f"Environment: {values.get('environment')}")
            logger.info(f"Ingress enabled: {spec.get('ingress', {}).get('enabled')}")
            logger.info(f"Egress enabled: {spec.get('egressController', {}).get('enabled')}")
            logger.info("=" * 60)
