    #!/usr/bin/env python3 
    """ 
    Job Manager v6.0.2 - Logs Détaillés

    CHANGEMENTS v6.0.2: 
    - ⭐ Log détaillé pour chaque job traité 
    - ⭐ Affichage des jobs créés/skippés avec raison 
    - ⭐ Statistiques en fin d'exécution 
    """
    import time 
    import logging 
    from kubernetes import client 
    from kubernetes.client.rest import ApiException

    logger = logging.getLogger(__name__)


    class JobManager:
      """Gestion automatique des Jobs - Template-Centric Pure"""

      def __init__(self, template_manager, resource_manager, batch_v1, core_v1, namespace):
          self.template_manager = template_manager
          self.resource_manager = resource_manager
          self.batch_v1 = batch_v1
          self.core_v1 = core_v1
          self.namespace = namespace

      def execute_all_jobs(self, values, wait=True, timeout=60):
          """
          ⭐ v6.0.3: Exécute les templates de jobs - ZÉRO logique métier

          Le code ne décide RIEN.
          Chaque template Jinja2 décide s'il produit des Jobs selon ses conditions.
          """
          job_templates = self.template_manager.load_jobs_order()

          if not job_templates:
              logger.debug("📋 No job templates defined")
              return {'created': [], 'skipped': [], 'failed': []}

          logger.info(f"📋 Processing {len(job_templates)} job template(s)...")

          results = {
              'created': [],
              'skipped': [],
              'failed': []
          }

          job_templates_content = self.template_manager.load_templates(job_templates)

          # ⭐ Traiter chaque template de job EXACTEMENT comme les templates Cilium
          for i, template_name in enumerate(job_templates, 1):
              try:
                  if template_name not in job_templates_content:
                      logger.warning(f"   [{i}/{len(job_templates)}] ⚠️  {template_name}: Not loaded")
                      results['failed'].append({
                          'template': template_name,
                          'reason': 'Template not found'
                      })
                      continue

                  # ⭐ Rendre le template - il décide SEUL s'il produit des Jobs
                  docs = self.template_manager.render_to_documents(template_name, values)

                  # ⭐ Si le template ne produit rien (conditions Jinja2 non remplies)
                  if not docs or all(not doc for doc in docs):
                      logger.info(f"   [{i}/{len(job_templates)}] ⏭️  {template_name}")
                      results['skipped'].append(template_name)
                      continue

                  # ⭐ Compter les Jobs produits
                  job_count = sum(1 for d in docs if d and d.get('kind') == 'Job')

                  if job_count == 0:
                      logger.info(f"   [{i}/{len(job_templates)}] ⏭️  {template_name}")
                      results['skipped'].append(template_name)
                      continue

                  # ⭐ Le template a produit des Jobs
                  logger.info(f"   [{i}/{len(job_templates)}] 🚀 {template_name}")

                  # Traiter chaque Job produit
                  job_idx = 0
                  for doc in docs:
                      if not doc or doc.get('kind') != 'Job':
                          continue

                      job_idx += 1
                      job_name = doc.get('metadata', {}).get('name')

                      if not job_name:
                          logger.error(f"      ❌ Job without name")
                          results['failed'].append({
                              'template': template_name,
                              'reason': 'No job name'
                          })
                          continue

                      # Supprimer l'ancien job
                      try:
                          self.batch_v1.delete_namespaced_job(
                              name=job_name,
                              namespace=self.namespace,
                              propagation_policy='Background'
                          )
                          time.sleep(0.2)
                      except ApiException as e:
                          if e.status != 404:
                              logger.debug(f"      Cleaned old job")

                      # Créer le job
                      self.resource_manager.apply_or_delete(doc, template_name=None)

                      # ⭐ Log simple
                      logger.debug(f"      [{job_idx}] {job_name}")
                      results['created'].append(job_name)

              except Exception as e:
                  logger.error(f"   [{i}/{len(job_templates)}] ❌ {template_name}: {e}")
                  import traceback
                  logger.error(traceback.format_exc())
                  results['failed'].append({
                      'template': template_name,
                      'reason': str(e)
                  })

          # ⭐ Résumé simple
          created_count = len(results['created'])
          skipped_count = len(results['skipped'])
          failed_count = len(results['failed'])

          if created_count > 0 or failed_count > 0:
              logger.info(f"✅ Jobs: {created_count} created, {skipped_count} skipped, {failed_count} failed")
          else:
              logger.info(f"✅ Jobs: {created_count} created, {skipped_count} skipped")

          # ⭐ Détail des jobs créés (niveau INFO)
          if created_count > 0:
              logger.info(f"   Created jobs:")
              for job_name in results['created']:
                  logger.info(f"      - {job_name}")

          # ⭐ Erreurs
          if failed_count > 0:
              logger.warning(f"   Failed:")
              for failure in results['failed']:
                  logger.warning(f"      - {failure.get('template', 'unknown')}: {failure.get('reason', 'unknown')}")

          # Attendre complétion
          if wait and results['created']:
              self.wait_for_jobs(results['created'], timeout=timeout)

          return results

      def wait_for_jobs(self, job_names, timeout=60):
          """Attend la complétion des Jobs"""
          if not job_names:
              return

          logger.info(f"⏳ Waiting for {len(job_names)} job(s)...")
          start_time = time.time()
          pending_jobs = set(job_names)

          while pending_jobs and (time.time() - start_time) < timeout:
              completed = set()
              for job_name in list(pending_jobs):
                  try:
                      status = self.batch_v1.read_namespaced_job_status(
                          name=job_name, namespace=self.namespace
                      )
                      if (status.status.succeeded or 0) > 0:
                          logger.info(f"   ✅ {job_name}")
                          completed.add(job_name)
                      elif (status.status.failed or 0) > 0:
                          logger.warning(f"   ❌ {job_name}")
                          completed.add(job_name)
                  except ApiException as e:
                      if e.status == 404:
                          completed.add(job_name)

              pending_jobs -= completed
              if pending_jobs:
                  time.sleep(1)

          if pending_jobs:
              logger.warning(f"⚠️  Timeout: {len(pending_jobs)} job(s) not completed")
          else:
              elapsed = int(time.time() - start_time)
              logger.info(f"✅ All jobs completed in {elapsed}s")
