    #!/usr/bin/env python3
    """
    Node Finder - Détection du nœud hébergeant la VIP
    Supporte nodeSelector pour filtrer les nœuds éligibles
    """
    import logging
    from kubernetes.client.rest import ApiException

    logger = logging.getLogger(__name__)


    class NodeFinder:
        """Trouve le nœud hébergeant la VIP"""

        def __init__(self, core_v1, custom_api):
            self.core_v1 = core_v1
            self.custom_api = custom_api

        def get_eligible_nodes(self, values):
            spec = values.get('spec', {})
            node_selector = spec.get('ingress', {}).get('controller', {}).get('nodeSelector', {})
            label_key = node_selector.get('label', '')
            label_value = node_selector.get('value', '')
            try:
                if label_key:
                    label_selector = f"{label_key}={label_value}"
                    nodes = self.core_v1.list_node(label_selector=label_selector)
                else:
                    nodes = self.core_v1.list_node()
                eligible = [
                    n.metadata.name for n in nodes.items
                    if self._is_node_ready(n)
                ]
                eligible.sort()
                return eligible
            except Exception as e:
                logger.error(f"❌ Error getting eligible nodes: {e}")
                return []

        def find_node_hosting_vip(self, values):
            eligible_nodes = self.get_eligible_nodes(values)
            if not eligible_nodes:
                raise ValueError("No eligible nodes available")

            namespace_name = values.get('namespace_name')
            spec = values.get('spec', {})
            watched_service = spec.get('ingress', {}).get('serviceName', 'lb-gateway')
            l2_policy_name = values.get('l2_policy_name')

            for method_name, method in [
                ('endpoints', lambda: self._find_via_endpoints(namespace_name, watched_service, eligible_nodes)),
                ('annotations', lambda: self._find_via_service_annotations(namespace_name, watched_service, eligible_nodes)),
                ('l2_policy', lambda: self._find_via_l2_policy(l2_policy_name, eligible_nodes)),
                ('deterministic', lambda: self._select_deterministic_node(namespace_name, eligible_nodes)),
            ]:
                try:
                    node = method()
                    if node:
                        logger.debug(f"Node found via {method_name}: {node}")
                        return node
                except Exception as e:
                    logger.debug(f"{method_name} method failed: {e}")

            raise ValueError("Unable to determine node for VIP")

        def _find_via_endpoints(self, namespace_name, watched_service, eligible_nodes):
            ep = self.core_v1.read_namespaced_endpoints(
                name=watched_service, namespace=namespace_name
            )
            pod_ips = []
            if ep.subsets:
                for subset in ep.subsets:
                    if subset.addresses:
                        for addr in subset.addresses:
                            if addr.target_ref and addr.target_ref.kind == "Pod":
                                pod_ips.append(addr.ip)
            if not pod_ips:
                return None
            pods = self.core_v1.list_namespaced_pod(namespace=namespace_name)
            for pod in pods.items:
                if pod.status.pod_ip in pod_ips and pod.spec.node_name:
                    node_name = pod.spec.node_name
                    if node_name in eligible_nodes:
                        return node_name
            return None

        def _find_via_service_annotations(self, namespace_name, watched_service, eligible_nodes):
            svc = self.core_v1.read_namespaced_service(
                name=watched_service, namespace=namespace_name
            )
            if svc.metadata.annotations:
                node_name = svc.metadata.annotations.get("io.cilium/l2-announcement-node")
                if node_name and node_name in eligible_nodes:
                    return node_name
            return None

        def _find_via_l2_policy(self, l2_policy_name, eligible_nodes):
            try:
                policy = self.custom_api.get_cluster_custom_object(
                    group="cilium.io", version="v2alpha1",
                    plural="ciliuml2announcementpolicies", name=l2_policy_name
                )
                node_name = policy.get('spec', {}).get('nodeSelector', {}).get(
                    'matchLabels', {}
                ).get('kubernetes.io/hostname')
                if node_name and node_name in eligible_nodes:
                    return node_name
            except ApiException:
                pass
            return None

        def _select_deterministic_node(self, namespace_name, eligible_nodes):
            if not eligible_nodes:
                raise ValueError("No eligible nodes available")
            try:
                ns = self.core_v1.read_namespace(name=namespace_name)
                recorded = (ns.metadata.labels or {}).get('egress-vip.io/node')
                if recorded and recorded in eligible_nodes:
                    logger.info(f"♻️  Reusing recorded node: {recorded}")
                    return recorded
            except Exception:
                pass
            return eligible_nodes[0]

        def _is_node_ready(self, node):
            if not node.status or not node.status.conditions:
                return False
            for cond in node.status.conditions:
                if cond.type == "Ready" and cond.status == "True":
                    return True
            return False
