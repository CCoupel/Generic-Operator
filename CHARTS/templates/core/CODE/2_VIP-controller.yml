    #!/usr/bin/env python3
    """
    Template Manager v6.0.5 - Pas de Log des Values

    CHANGEMENTS v6.0.5:
    - ⭐ SUPPRESSION de l'affichage des values dans render()
    - ⭐ Le controller affiche les values UNE FOIS au début
    - ⭐ render() se concentre sur son job: rendre les templates

    """
    import os
    import logging
    import yaml
    import json
    from jinja2 import Environment, BaseLoader
    from kubernetes import client
    from kubernetes.client.rest import ApiException

    logger = logging.getLogger(__name__)

    TEMPLATES_CONFIGMAP_ORDER = os.getenv('TEMPLATES_CONFIGMAP_ORDER', 'vip-controller-templates-order')
    TEMPLATES_CONFIGMAP_ORDER_CUSTOM = os.getenv('TEMPLATES_CONFIGMAP_ORDER_CUSTOM', 'vip-controller-templates-order-custom')

    # ⭐ NE PAS lire DEBUG_VALUES ici !
    # DEBUG_VALUES = os.getenv('DEBUG_VALUES', 'false').lower() == 'true'  ← FAUX


    class TemplateManager:
        """Gestion des templates Jinja2 avec debug VRAIMENT dynamique"""

        def __init__(self, namespace):
            self.namespace = namespace
            self.templates_cache = {}
            self.configmaps_cache = {}
            self.order_config_cache = None
            
            self.stats = {
                'api_calls': 0,
                'cache_hits': 0,
                'templates_rendered': 0
            }
            
            self.jinja_env = Environment(
                loader=BaseLoader(),
                variable_start_string='[{',
                variable_end_string='}]',
                block_start_string='[%',
                block_end_string='%]',
                comment_start_string='[#',
                comment_end_string='#]'
            )
            
            logger.info(f"📦 TemplateManager v6.0.5 initialized")
            logger.info(f"   Order ConfigMap: {TEMPLATES_CONFIGMAP_ORDER}")
            
            # ⭐ Afficher la valeur ACTUELLE au démarrage
            current_debug = os.getenv('DEBUG_VALUES', 'false')
            if current_debug.lower() == 'true':
                logger.info(f"   🐛 DEBUG_VALUES: ✅ ENABLED")
            else:
                logger.info(f"   🐛 DEBUG_VALUES: ❌ disabled (current value: '{current_debug}')")

        def _load_templates_order_config(self, force_reload=False):
            """Charge templates-order.yaml AVEC CACHE + custom order optionnel"""
            if self.order_config_cache is not None and not force_reload:
                self.stats['cache_hits'] += 1
                logger.debug("♻️  Using cached templates-order.yaml")
                return self.order_config_cache

            try:
                logger.debug(f"📡 API call: Loading {TEMPLATES_CONFIGMAP_ORDER}")
                self.stats['api_calls'] += 1

                v1 = client.CoreV1Api()
                config_map = v1.read_namespaced_config_map(
                    name=TEMPLATES_CONFIGMAP_ORDER,
                    namespace=self.namespace
                )

                order_yaml = config_map.data.get('templates-order.yaml')
                if not order_yaml:
                    logger.error(f"❌ 'templates-order.yaml' not found in {TEMPLATES_CONFIGMAP_ORDER}")
                    return {}

                config = yaml.safe_load(order_yaml)

                templates_count = len(config.get('templates', []))
                jobs_count = len(config.get('jobs', []))
                logger.info(f"✅ Loaded {TEMPLATES_CONFIGMAP_ORDER} (templates: {templates_count}, jobs: {jobs_count})")

                # ⭐ Charger le custom order s'il existe (optionnel)
                try:
                    logger.debug(f"📡 API call: Loading {TEMPLATES_CONFIGMAP_ORDER_CUSTOM}")
                    self.stats['api_calls'] += 1

                    custom_cm = v1.read_namespaced_config_map(
                        name=TEMPLATES_CONFIGMAP_ORDER_CUSTOM,
                        namespace=self.namespace
                    )
                    custom_yaml = custom_cm.data.get('templates-order.yaml')
                    if custom_yaml:
                        custom_config = yaml.safe_load(custom_yaml)
                        custom_templates = custom_config.get('templates', [])
                        custom_jobs = custom_config.get('jobs', [])

                        # Append après les templates/jobs standard
                        config['templates'] = config.get('templates', []) + custom_templates
                        config['jobs'] = config.get('jobs', []) + custom_jobs

                        logger.info(f"✅ Custom order loaded from {TEMPLATES_CONFIGMAP_ORDER_CUSTOM}:")
                        logger.info(f"   +{len(custom_templates)} template(s): {custom_templates}")
                        logger.info(f"   +{len(custom_jobs)} job(s): {custom_jobs}")
                    else:
                        logger.warning(f"⚠️  'templates-order.yaml' not found in {TEMPLATES_CONFIGMAP_ORDER_CUSTOM}")

                except ApiException as e:
                    if e.status == 404:
                        logger.debug(f"ℹ️  No custom order ConfigMap '{TEMPLATES_CONFIGMAP_ORDER_CUSTOM}' (optional)")
                    else:
                        logger.warning(f"⚠️  Error loading custom order: {e}")

                self.order_config_cache = config

                total_templates = len(config.get('templates', []))
                total_jobs = len(config.get('jobs', []))
                logger.info(f"📋 Final order: {total_templates} template(s), {total_jobs} job(s)")

                return config

            except ApiException as e:
                if e.status == 404:
                    logger.error(f"❌ ConfigMap '{TEMPLATES_CONFIGMAP_ORDER}' not found")
                else:
                    logger.error(f"❌ Error loading templates order: {e}")
                import traceback
                logger.error(traceback.format_exc())
                return {}
            except Exception as e:
                logger.error(f"❌ Error loading templates order: {e}")
                import traceback
                logger.error(traceback.format_exc())
                return {}
        def load_templates_order(self):
            """Charge la liste des templates (AVEC CACHE)"""
            config = self._load_templates_order_config()
            return config.get('templates', [])

        def load_jobs_order(self):
            """Charge la liste des jobs (AVEC CACHE)"""
            config = self._load_templates_order_config()
            return config.get('jobs', [])

        def load_templates(self, templates_list):
            """Charge les templates depuis ConfigMaps (AVEC CACHE)"""
            try:
                v1 = client.CoreV1Api()
                templates = {}
                new_cms = 0
                cached_cms = 0
                
                for template_key in templates_list:
                    try:
                        if '/' not in template_key:
                            logger.warning(f"⚠️  Invalid format: '{template_key}'")
                            continue
                        
                        cm_name, file_key = template_key.split('/', 1)
                        
                        if cm_name not in self.configmaps_cache:
                            logger.debug(f"📡 API call: Loading ConfigMap '{cm_name}'")
                            self.stats['api_calls'] += 1
                            new_cms += 1
                            
                            try:
                                config_map = v1.read_namespaced_config_map(
                                    name=cm_name,
                                    namespace=self.namespace
                                )
                                self.configmaps_cache[cm_name] = config_map.data or {}
                            except ApiException as e:
                                if e.status == 404:
                                    logger.warning(f"⚠️  ConfigMap '{cm_name}' not found")
                                    self.configmaps_cache[cm_name] = {}
                                else:
                                    raise
                        else:
                            self.stats['cache_hits'] += 1
                            cached_cms += 1
                        
                        cm_data = self.configmaps_cache[cm_name]
                        if file_key in cm_data:
                            templates[template_key] = cm_data[file_key]
                        else:
                            logger.warning(f"⚠️  '{file_key}' not found in '{cm_name}'")
                    
                    except Exception as e:
                        logger.error(f"❌ Error loading '{template_key}': {e}")
                        continue
                
                if new_cms > 0 or cached_cms > 0:
                    logger.debug(f"📦 Templates: {len(templates)}/{len(templates_list)} "
                            f"(new: {new_cms}, cached: {cached_cms})")
                
                return templates
                
            except Exception as e:
                logger.error(f"❌ Error loading templates: {e}")
                return {}

        def render(self, template_name, values):
            """
            ⭐ v6.0.5: Rend un template SANS afficher les values
            (Les values sont affichées UNE FOIS par le controller)
            """
            if template_name not in self.templates_cache:
                self.templates_cache.update(self.load_templates([template_name]))
            
            if template_name not in self.templates_cache:
                logger.warning(f"⚠️  Template '{template_name}' not found")
                return None
            
            try:
                self.stats['templates_rendered'] += 1
                
                # ⭐ PAS d'affichage des values ici
                # C'est le controller qui s'en charge UNE FOIS
                
                # Rendre le template
                template = self.jinja_env.from_string(self.templates_cache[template_name])
                rendered = template.render(**values)
                
                return rendered
                
            except Exception as e:
                logger.error(f"❌ Error rendering '{template_name}': {e}")
                
                # ⭐ En cas d'erreur, afficher les values pour debug
                logger.error("=" * 70)
                logger.error("❌ Values that caused the error:")
                logger.error("=" * 70)
                for key in sorted(values.keys()):
                    try:
                        value = values[key]
                        if isinstance(value, (dict, list)):
                            logger.error(f"   {key}: <{type(value).__name__} with {len(value)} items>")
                        else:
                            logger.error(f"   {key}: {value}")
                    except Exception:
                        logger.error(f"   {key}: <unprintable>")
                logger.error("=" * 70)
                
                import traceback
                logger.error(traceback.format_exc())
                return None


        def render_to_documents(self, template_name, values):
            """Rend un template et parse en documents YAML"""
            rendered = self.render(template_name, values)
            if not rendered:
                return []
            
            try:
                docs = list(yaml.safe_load_all(rendered))
                valid_docs = [d for d in docs if d]
                
                return valid_docs
                
            except yaml.YAMLError as e:
                logger.error(f"❌ YAML error for '{template_name}': {e}")
                logger.error(f"Rendered content (first 500 chars):\n{rendered[:500]}")
                return []

        def get_stats(self):
            """Retourne les statistiques de cache"""
            return self.stats.copy()

        def log_stats(self):
            """
            ⭐ Affiche les statistiques SEULEMENT en mode DEBUG
            """
            if not logger.isEnabledFor(logging.DEBUG):
                return
            
            logger.debug("📊 TemplateManager Statistics:")
            logger.debug(f"   API calls: {self.stats['api_calls']}")
            logger.debug(f"   Cache hits: {self.stats['cache_hits']}")
            logger.debug(f"   Templates rendered: {self.stats['templates_rendered']}")
            logger.debug(f"   ConfigMaps in cache: {len(self.configmaps_cache)}")

        def reload(self):
            """Force le rechargement de tous les caches"""
            logger.info("🔄 Reloading all templates...")
            
            old_stats = self.stats.copy()
            
            self.templates_cache = {}
            self.configmaps_cache = {}
            self.order_config_cache = None
            
            self.stats = {
                'api_calls': 0,
                'cache_hits': 0,
                'templates_rendered': 0
            }
            
            self._load_templates_order_config(force_reload=True)
            
            logger.info(f"✅ Reload complete (was: {old_stats})")

            