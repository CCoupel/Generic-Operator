    """
    Resource Manager v5.0.6 - Server-Side Apply + Finalizers
    """
    import os
    import json
    import logging
    import re
    import time
    import kubernetes
    import kubernetes.dynamic
    from kubernetes import client
    from kubernetes.client.rest import ApiException

    # CRD piloté par le moteur générique (voir values.yaml::crd)
    CRD_GROUP = os.getenv('CRD_GROUP', 'secure-ns.example.com')

    logger = logging.getLogger(__name__)

    FIELD_MANAGER = 'vip-controller'
    FINALIZER_PREFIX = f'vip.{CRD_GROUP}/'
    MAX_FINALIZER_LEN = 63

    def template_to_finalizer(template_name):
        """Convertit un nom de template en nom de finalizer valide"""
        base = re.sub(r'\.(yaml|yml)$', '', template_name)
        clean = re.sub(r'[^a-z0-9-]', '-', base.lower())
        clean = re.sub(r'-+', '-', clean).strip('-')
        max_name_len = MAX_FINALIZER_LEN - len(FINALIZER_PREFIX)
        clean = clean[:max_name_len]
        return f"{FINALIZER_PREFIX}{clean}"

    class ResourceManager:
        def __init__(self, api_client):
            self.api_client = api_client
            self.dyn_client = kubernetes.dynamic.DynamicClient(api_client)
            self.apps_v1 = client.AppsV1Api(api_client)
            self.deployment_name = os.getenv('DEPLOYMENT_NAME')
            self.deployment_namespace = os.getenv('NAMESPACE', 'namespace-operator')

            if self.deployment_name:
                logger.info(f"🔒 Finalizer target: Deployment/{self.deployment_name}")

            self._api_resource_cache = {}

        def _get_api_resource(self, api_version, kind):
            cache_key = f"{api_version}/{kind}"
            if cache_key not in self._api_resource_cache:
                self._api_resource_cache[cache_key] = self.dyn_client.resources.get(
                    api_version=api_version, kind=kind
                )
            return self._api_resource_cache[cache_key]

        def _get_deployment_finalizers(self):
            if not self.deployment_name:
                return []
            try:
                deploy = self.apps_v1.read_namespaced_deployment(
                    name=self.deployment_name,
                    namespace=self.deployment_namespace
                )
                return list(deploy.metadata.finalizers or [])
            except ApiException as e:
                if e.status != 404:
                    logger.warning(f"⚠️  Error reading finalizers: {e}")
                return []

        def _patch_deployment_json_patch(self, patch_operations):
            """Applique JSON Patch au Deployment avec auth token"""
            if not self.deployment_name:
                return False

            try:
                path = (
                    f"/apis/apps/v1/namespaces/{self.deployment_namespace}"
                    f"/deployments/{self.deployment_name}"
                )

                auth_token = None
                if hasattr(self.api_client, 'configuration'):
                    config = self.api_client.configuration
                    if hasattr(config, 'api_key') and config.api_key:
                        auth_token = config.api_key.get('authorization')

                headers = {
                    'Content-Type': 'application/json-patch+json',
                    'Accept': 'application/json'
                }

                if auth_token:
                    headers['Authorization'] = auth_token

                response = self.api_client.call_api(
                    path,
                    'PATCH',
                    header_params=headers,
                    body=patch_operations,
                    response_type='object',
                    _return_http_data_only=True
                )

                return True

            except Exception as e:
                logger.error(f"❌ JSON Patch failed: {e}")
                return False

        def add_finalizer(self, template_name):
            """Ajoute un finalizer avec JSON Patch"""
            if not self.deployment_name:
                return

            finalizer = template_to_finalizer(template_name)
            current = self._get_deployment_finalizers()

            if finalizer in current:
                return

            logger.debug(f"🔒 Adding finalizer: {finalizer}")

            if not current:
                patch = [{"op": "add", "path": "/metadata/finalizers", "value": [finalizer]}]
            else:
                patch = [{"op": "add", "path": "/metadata/finalizers/-", "value": finalizer}]

            if self._patch_deployment_json_patch(patch):
                time.sleep(0.1)

        def remove_finalizer(self, template_name):
            """Retire un finalizer avec JSON Patch"""
            if not self.deployment_name:
                return

            finalizer = template_to_finalizer(template_name)
            current = self._get_deployment_finalizers()

            logger.debug(f"🔓 Removing finalizer: {finalizer}")

            if finalizer not in current:
                return

            try:
                index = current.index(finalizer)
            except ValueError:
                return

            if len(current) == 1:
                patch = [{"op": "remove", "path": "/metadata/finalizers"}]
            else:
                patch = [{"op": "remove", "path": f"/metadata/finalizers/{index}"}]

            if self._patch_deployment_json_patch(patch):
                time.sleep(0.1)

        def get_active_finalizers(self):
            current = self._get_deployment_finalizers()
            return [f for f in current if f.startswith(FINALIZER_PREFIX)]

        def apply_resource(self, resource, template_name=None):
            kind = resource.get('kind')
            api_version = resource.get('apiVersion', 'v1')
            metadata = resource.get('metadata', {})
            name = metadata.get('name')
            namespace = metadata.get('namespace')

            if not kind or not name:
                return False

            no_finalizer = resource.get('_no_finalizer', False)
            resource_copy = {k: v for k, v in resource.items()
                            if k not in ('_action', '_template', '_no_finalizer')}

            try:
                api_resource = self._get_api_resource(api_version, kind)

                if api_resource.namespaced:
                    api_resource.server_side_apply(
                        body=resource_copy, name=name, namespace=namespace,
                        field_manager=FIELD_MANAGER, force_conflicts=True
                    )
                else:
                    api_resource.server_side_apply(
                        body=resource_copy, name=name,
                        field_manager=FIELD_MANAGER, force_conflicts=True
                    )

                if template_name and not no_finalizer:
                    self.add_finalizer(template_name)

                return True

            except Exception as e:
                logger.error(f"Error applying {kind}/{name}: {e}")
                raise

        def delete_resource(self, resource, template_name=None):
            """Supprime ressource puis retire finalizer"""
            kind = resource.get('kind')
            api_version = resource.get('apiVersion', 'v1')
            metadata = resource.get('metadata', {})
            name = metadata.get('name')
            namespace = metadata.get('namespace')

            if not kind or not name:
                return False

            try:
                api_resource = self._get_api_resource(api_version, kind)

                try:
                    if api_resource.namespaced:
                        api_resource.delete(name=name, namespace=namespace)
                    else:
                        api_resource.delete(name=name)

                    if template_name:
                        self.remove_finalizer(template_name)

                except kubernetes.dynamic.exceptions.NotFoundError:
                    if template_name:
                        self.remove_finalizer(template_name)

                return True

            except Exception as e:
                logger.error(f"Error deleting {kind}/{name}: {e}")
                raise

        def apply_or_delete(self, resource, template_name=None):
            action = resource.get('_action', 'apply')
            kind = resource.get('kind')
            name = resource.get('metadata', {}).get('name')

            if action == 'delete':
                return self.delete_resource(resource, template_name)
            else:
                return self.apply_resource(resource, template_name)
