    #!/usr/bin/env python3
    """
    Gestionnaire de révisions et d'historique
    """
    import logging
    import json
    import kubernetes
    from datetime import datetime
    from config import CRD_GROUP, CRD_VERSION, CRD_PLURAL

    logger = logging.getLogger(__name__)


    def get_revision_number(api_client, securenamespace_name):
        """
        Récupère le numéro de révision SANS l'incrémenter
        """
        try:
            custom_api = kubernetes.client.CustomObjectsApi(api_client)
            resource = custom_api.get_cluster_custom_object(
                group=CRD_GROUP,
                version=CRD_VERSION,
                plural=CRD_PLURAL,
                name=securenamespace_name
            )
            current_revision = resource.get('metadata', {}).get('annotations', {}).get(f'{CRD_GROUP}/revision', '0')
            logger.info(f"📊 Révision actuelle: {current_revision}")
            return int(current_revision)
        except Exception as e:
            logger.warning(f"Impossible de récupérer la révision: {e}")
            return 0


    def increment_revision(api_client, securenamespace_name):
        """
        Incrémente simplement la révision lors d'une mise à jour
        """
        try:
            custom_api = kubernetes.client.CustomObjectsApi(api_client)
            resource = custom_api.get_cluster_custom_object(
                group=CRD_GROUP,
                version=CRD_VERSION,
                plural=CRD_PLURAL,
                name=securenamespace_name
            )
            current_revision = int(resource.get('metadata', {}).get('annotations', {}).get(f'{CRD_GROUP}/revision', '0'))
            new_revision = current_revision + 1
            logger.info(f"📊 Incrémentation révision: {current_revision} → {new_revision}")
            patch = {'metadata': {'annotations': {f'{CRD_GROUP}/revision': str(new_revision)}}}
            custom_api.patch_cluster_custom_object(
                group=CRD_GROUP,
                version=CRD_VERSION,
                plural=CRD_PLURAL,
                name=securenamespace_name,
                body=patch
            )
            logger.info(f"✅ Révision mise à jour: {new_revision}")
            return new_revision
        except Exception as e:
            logger.warning(f"Impossible d'incrémenter la révision: {e}")
            return None


    def add_history_entry_to_configmap(api_client, securenamespace_name, securenamespace_uid, diff, revision, spec_data=None, status=None, logger_obj=None):
        """
        Ajoute une entrée d'historique dans une ConfigMap dédiée
        """
        try:
            from config import OPERATOR_NAMESPACE
            from utils import format_diff_entry, format_history_text, get_history_configmap_name, spec_to_dict

            v1 = kubernetes.client.CoreV1Api(api_client)
            timestamp = datetime.utcnow().isoformat() + 'Z'

            changes = []
            for change in diff:
                formatted_change = format_diff_entry(change)
                if formatted_change:
                    changes.append(formatted_change)

            history_entry = {
                'timestamp': timestamp,
                'revision': revision,
                'changes': changes,
                'changeCount': len(changes)
            }

            if status:
                history_entry['status'] = {
                    'succeeded': status.get('succeeded', 0),
                    'failed': status.get('failed_count', 0),
                    'total': status.get('total', 0),
                    'errors': status.get('failed', [])
                }

            if spec_data:
                history_entry['spec'] = spec_to_dict(spec_data)

            configmap_name = get_history_configmap_name(securenamespace_name)
            configmap = None
            history = []

            try:
                configmap = v1.read_namespaced_config_map(name=configmap_name, namespace=OPERATOR_NAMESPACE)
                if configmap.metadata.owner_references:
                    if logger_obj:
                        logger_obj.info(f"🔧 Suppression des ownerReferences du ConfigMap historique")
                    configmap.metadata.owner_references = None
                history_json = configmap.data.get('history.json', '[]')
                history = json.loads(history_json)
            except kubernetes.client.exceptions.ApiException as e:
                if e.status == 404:
                    history = []
                else:
                    raise

            history.append(history_entry)
            if len(history) > 100:
                history = history[-100:]

            config_data = {
                'history.json': json.dumps(history, indent=2),
                'history.txt': format_history_text(history)
            }

            if configmap:
                configmap.data = config_data
                v1.patch_namespaced_config_map(name=configmap_name, namespace=OPERATOR_NAMESPACE, body=configmap)
            else:
                new_configmap = kubernetes.client.V1ConfigMap(
                    metadata=kubernetes.client.V1ObjectMeta(
                        name=configmap_name,
                        namespace=OPERATOR_NAMESPACE,
                        labels={
                            'app.kubernetes.io/name': securenamespace_name,
                            'app.kubernetes.io/component': 'history',
                            'app.kubernetes.io/managed-by': 'secure-namespace-operator',
                            f'{CRD_GROUP}/securenamespace': securenamespace_name,
                        },
                    ),
                    data=config_data
                )
                v1.create_namespaced_config_map(namespace=OPERATOR_NAMESPACE, body=new_configmap)

            if logger_obj:
                logger_obj.info(f"📝 Historique enregistré dans ConfigMap {configmap_name}")
                if status and status.get('failed_count', 0) > 0:
                    logger_obj.warning(f"   {status['succeeded']} réussi(s), {status['failed_count']} erreur(s)")

            return True

        except Exception as e:
            if logger_obj:
                logger_obj.warning(f"Impossible d'enregistrer l'historique: {e}")
            return False

