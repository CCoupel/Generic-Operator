    #!/usr/bin/env python3
    """
    Utilitaires génériques pour l'opérateur
    """
    import logging
    import json
    from datetime import datetime

    logger = logging.getLogger(__name__)


    def deep_merge(base, override):
        """
        Merge récursif de deux dictionnaires
        Les valeurs de 'override' écrasent celles de 'base'
        """
        result = base.copy()
        
        for key, value in override.items():
            if key in result and isinstance(result[key], dict) and isinstance(value, dict):
                result[key] = deep_merge(result[key], value)
            else:
                result[key] = value
        
        return result


    def spec_to_dict(spec):
        """
        Convertit un objet spec Kubernetes en dictionnaire Python sérialisable en JSON
        """
        if isinstance(spec, dict):
            return spec
        
        # Si c'est un objet Kubernetes, le convertir
        if hasattr(spec, 'to_dict'):
            return spec.to_dict()
        
        # Sinon utiliser json pour sérialiser/désérialiser
        try:
            return json.loads(json.dumps(spec, default=str))
        except:
            return {'error': 'Impossible de convertir le spec'}


    def format_diff_entry(diff):
        """
        Convertit un tuple diff kopf en dictionnaire lisible
        """
        if not diff or len(diff) < 3:
            return None
        
        change_type = diff[0]
        path_tuple = diff[1] if isinstance(diff[1], tuple) else (diff[1],)
        
        formatted = {
            'type': change_type,
            'path': 'spec.' + '.'.join(str(p) for p in path_tuple),
        }
        
        if change_type == 'change' and len(diff) >= 4:
            formatted['oldValue'] = diff[2]
            formatted['newValue'] = diff[3]
        elif change_type == 'add' and len(diff) >= 3:
            formatted['newValue'] = diff[2]
        elif change_type == 'remove' and len(diff) >= 3:
            formatted['oldValue'] = diff[2]
        
        return formatted


    def format_history_text(history):
        """
        Formate l'historique en texte lisible pour la ConfigMap
        """
        lines = ["# Historique des changements", ""]
        
        for entry in reversed(history[-20:]):  # 20 dernières entrées
            timestamp = entry.get('timestamp', 'N/A')
            revision = entry.get('revision', 'N/A')
            change_count = entry.get('changeCount', 0)
            lines.append(f"## [{timestamp}] Révision {revision} ({change_count} changement(s))")
            
            for change in entry.get('changes', []):
                path = change.get('path', 'unknown')
                if 'oldValue' in change and 'newValue' in change:
                    old = change['oldValue']
                    new = change['newValue']
                    lines.append(f"  - {path}: {old} → {new}")
                elif 'newValue' in change:
                    lines.append(f"  - {path}: +{change['newValue']}")
                elif 'oldValue' in change:
                    lines.append(f"  - {path}: -{change['oldValue']}")
            
            lines.append("")
        
        return "\n".join(lines)


    def get_history_configmap_name(securenamespace_name):
        """
        Génère le nom du ConfigMap d'historique
        """
        return f"{securenamespace_name}-history"      