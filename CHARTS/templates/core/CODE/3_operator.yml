    #!/usr/bin/env python3
    """
    Gestionnaire du CRD SecureNamespace
    Extraction des defaults et gestion des labels/annotations
    """
    import logging
    import kubernetes
    from datetime import datetime
    from config import CRD_GROUP, CRD_VERSION, CRD_PLURAL

    logger = logging.getLogger(__name__)


    def get_operator_version():
        """
        Récupère la version de l'opérateur depuis son deployment
        """
        try:
            from config import OPERATOR_NAMESPACE
            apps_v1 = kubernetes.client.AppsV1Api()
            deployment = apps_v1.read_namespaced_deployment(
                name='secure-namespace-operator',
                namespace=OPERATOR_NAMESPACE
            )
            return deployment.metadata.labels.get('version', '1.0.0')
        except Exception as e:
            logger.warning(f"Impossible de récupérer la version de l'opérateur: {e}")
            return '1.0.0'


    def extract_defaults_from_crd():
        """
        Charge le CRD et extrait automatiquement tous les defaults
        """
        try:
            api = kubernetes.client.ApiextensionsV1Api()
            crd = api.read_custom_resource_definition(name=f'{CRD_PLURAL}.{CRD_GROUP}')
            
            # Convertir TOUT en dict dès le début
            schema_obj = crd.spec.versions[0].schema.open_apiv3_schema
            schema_dict = schema_obj.to_dict() if hasattr(schema_obj, 'to_dict') else schema_obj
            
            # Naviguer vers spec
            spec_schema = schema_dict.get('properties', {}).get('spec', {})
            
            logger.info("Extraction des defaults depuis le CRD...")
            defaults = extract_defaults_recursive_dict(spec_schema)
            logger.info(f"Defaults extraits: {defaults}")
            
            return defaults if defaults else {}
        except Exception as e:
            logger.warning(f"Impossible d'extraire les defaults du CRD: {e}")
            import traceback
            logger.warning(traceback.format_exc())
            return {}


    def extract_defaults_recursive_dict(schema):
        """
        Extrait récursivement les valeurs par défaut d'un schema (format dict)
        Ignore les valeurs None (pas de default défini)
        """
        if not isinstance(schema, dict):
            return {}
        
        # Si ce niveau a directement un default (et que ce n'est pas None)
        if 'default' in schema and schema['default'] is not None:
            return schema['default']
        
        # Si c'est un objet avec des propriétés
        if schema.get('type') == 'object' and 'properties' in schema:
            result = {}
            
            for prop_name, prop_schema in schema['properties'].items():
                # Récurser pour obtenir le default de cette propriété
                prop_default = extract_defaults_recursive_dict(prop_schema)
                
                # Ajouter au résultat seulement si:
                # - ce n'est pas None
                # - ce n'est pas un dict vide
                if prop_default is not None and prop_default != {}:
                    result[prop_name] = prop_default
            
            return result if result else {}
        
        return {}


    def apply_defaults_to_spec(spec):
        """
        Applique les valeurs par défaut du CRD au spec fourni
        Retourne un spec complet avec toutes les valeurs
        """
        from utils import deep_merge
        defaults = extract_defaults_from_crd()
        return deep_merge(defaults, spec)


    def extract_namespace_info(spec):
        """
        Extrait les informations de namespace depuis le spec
        """
        solution = spec.get('project', {}).get('solution', 'default')
        environment = spec.get('project', {}).get('environment', 'dev').lower()
        
        # Utiliser namespaceName si fourni, sinon calculer
        namespace_name = spec.get('namespaceName')
        if not namespace_name:
            namespace_name = f"{solution}-{environment}"
        
        return solution, environment, namespace_name


    def get_common_labels(spec, securenamespace_name, revision):
        """
        Génère les labels standards à appliquer sur toutes les ressources
        """
        solution, environment, namespace_name = extract_namespace_info(spec)
        
        labels = {
            # Labels standards Kubernetes
            'app.kubernetes.io/name': solution,
            'app.kubernetes.io/instance': namespace_name,
            'app.kubernetes.io/version': str(revision),
            'app.kubernetes.io/component': 'namespace',
            'app.kubernetes.io/part-of': solution,
            'app.kubernetes.io/managed-by': 'secure-namespace-operator',
            
            # Labels du domaine CRD (voir values.yaml::crd)
            f'{CRD_GROUP}/solution': solution,
            f'{CRD_GROUP}/environment': environment,
            f'{CRD_GROUP}/managed': 'true',
            f'{CRD_GROUP}/securenamespace': securenamespace_name,
            
            # Labels simples pour requêtes
            'environment': environment,
            'solution': solution,
        }
        
        return labels


    def get_common_annotations(securenamespace_name, revision):
        """
        Génère les annotations standards à appliquer sur toutes les ressources
        """
        from config import OPERATOR_NAMESPACE
        
        annotations = {
            # Traçabilité
            f'{CRD_GROUP}/created-by': 'secure-namespace-operator',
            f'{CRD_GROUP}/created-at': datetime.utcnow().isoformat() + 'Z',
            f'{CRD_GROUP}/securenamespace': securenamespace_name,
            f'{CRD_GROUP}/crd-namespace': OPERATOR_NAMESPACE,
            f'{CRD_GROUP}/revision': str(revision),
        }
        
        return annotations


    def get_owner_references(securenamespace_name, securenamespace_uid):
        """
        Génère les ownerReferences pour que les ressources soient supprimées
        automatiquement quand le SecureNamespace est supprimé
        """
        if not securenamespace_uid:
            return None
        
        return [
            {
                'apiVersion': f'{CRD_GROUP}/{CRD_VERSION}',
                'kind': 'SecureNamespace',
                'name': securenamespace_name,
                'uid': securenamespace_uid,
                'blockOwnerDeletion': False,
                'controller': True
            }
        ]

