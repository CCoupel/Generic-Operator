    #!/usr/bin/env python3
    """
    Gestionnaire de templates Jinja2 multi-ConfigMap
    """
    import logging
    import yaml
    import kubernetes
    from jinja2 import Environment, BaseLoader

    logger = logging.getLogger(__name__)


    def load_templates_order():
        """
        Charge l'ordre d'exécution des templates depuis le ConfigMap dédié
        Retourne une liste de clés au format 'configmap/template-key'
        """
        try:
            from config import OPERATOR_NAMESPACE
            
            v1 = kubernetes.client.CoreV1Api()
            config_map = v1.read_namespaced_config_map(
                name='secure-namespace-operator-templates-order',
                namespace=OPERATOR_NAMESPACE
            )
            
            templates_order_yaml = config_map.data.get('templates-order.yaml')
            if not templates_order_yaml:
                logger.error("❌ 'templates-order.yaml' introuvable dans le ConfigMap")
                return []
            
            templates_order_doc = yaml.safe_load(templates_order_yaml)
            templates_list = templates_order_doc.get('templates', [])
            
            logger.info(f"✅ Ordre de templates chargé: {len(templates_list)} templates")
            logger.debug(f"   Templates à appliquer: {templates_list}")
            return templates_list
            
        except kubernetes.client.exceptions.ApiException as e:
            if e.status == 404:
                logger.error("❌ ConfigMap 'secure-namespace-operator-templates-order' non trouvé")
            else:
                logger.error(f"❌ Impossible de charger l'ordre des templates: {e}")
            import traceback
            logger.error(traceback.format_exc())
            return []
        except Exception as e:
            logger.error(f"❌ Impossible de charger l'ordre des templates: {e}")
            import traceback
            logger.error(traceback.format_exc())
            return []


    def load_templates(templates_list):
        """
        Charge les templates depuis PLUSIEURS ConfigMaps
        en se basant sur la liste fournie au format 'configmap/key'
        
        Args:
            templates_list: Liste au format ['templates-core/namespace.yaml', ...]
        
        Retourne un dict: {'configmap/key': 'template_content'}
        """
        try:
            from config import OPERATOR_NAMESPACE
            v1 = kubernetes.client.CoreV1Api()
            
            templates = {}
            configmaps_cache = {}  # Cache pour éviter de charger plusieurs fois le même ConfigMap
            
            for template_key in templates_list:
                try:
                    # Parser le template_key: 'configmap-name/template-file.yaml'
                    if '/' not in template_key:
                        logger.warning(f"   ⚠️  Format invalide pour '{template_key}' (attendu: configmap/file)")
                        continue
                    
                    cm_name, file_key = template_key.split('/', 1)
                    
                    # Charger le ConfigMap (avec cache)
                    if cm_name not in configmaps_cache:
                        try:
                            config_map = v1.read_namespaced_config_map(
                                name=cm_name,
                                namespace=OPERATOR_NAMESPACE
                            )
                            configmaps_cache[cm_name] = config_map.data or {}
                            logger.debug(f"   📦 ConfigMap '{cm_name}' chargé")
                        except kubernetes.client.exceptions.ApiException as e:
                            if e.status == 404:
                                logger.warning(f"   ⚠️  ConfigMap '{cm_name}' non trouvé")
                                configmaps_cache[cm_name] = {}
                            else:
                                raise
                    
                    # Récupérer le template depuis le cache
                    cm_data = configmaps_cache[cm_name]
                    if file_key in cm_data:
                        templates[template_key] = cm_data[file_key]
                        logger.debug(f"   ✅ Template chargé: {template_key}")
                    else:
                        logger.warning(f"   ⚠️  Fichier '{file_key}' non trouvé dans ConfigMap '{cm_name}'")
                        logger.debug(f"      Fichiers disponibles: {list(cm_data.keys())}")
                
                except Exception as e:
                    logger.error(f"   ❌ Erreur chargement '{template_key}': {e}")
                    continue
            
            logger.info(f"✅ {len(templates)}/{len(templates_list)} templates chargés depuis {len(configmaps_cache)} ConfigMaps")
            return templates
            
        except Exception as e:
            logger.error(f"❌ Impossible de charger les templates: {e}")
            import traceback
            logger.error(traceback.format_exc())
            return {}


    def render_template(template_content, values):
        """
        Render un template Jinja2 avec les valeurs données
        ⭐ MODIFICATION: Utilise des délimiteurs personnalisés [{ }] et [% %]
        """
        env = Environment(
            loader=BaseLoader(),
            variable_start_string='[{',
            variable_end_string='}]',
            block_start_string='[%',
            block_end_string='%]',
            comment_start_string='[#',
            comment_end_string='#]'
        )
        template = env.from_string(template_content)
        rendered = template.render(**values)
        return rendered



    def get_template_values(spec, securenamespace_name, revision):
        """
        Construit le dictionnaire de valeurs pour le rendu des templates
        """
        from config import OPERATOR_NAMESPACE
        from crd_manager import (
            extract_namespace_info, 
            get_common_labels, 
            get_common_annotations,
            apply_defaults_to_spec
        )
        
        solution, environment, namespace_name = extract_namespace_info(spec)
        complete_spec = apply_defaults_to_spec(spec)
        
        common_labels = get_common_labels(spec, securenamespace_name, revision)
        common_annotations = get_common_annotations(securenamespace_name, revision)
        
        # Construire le domaine de manière sûre
        ingress_config = complete_spec.get('ingress', {})
        ingress_domain = ingress_config.get('domain', '')
        
        if ingress_domain:
            domain = f"{environment}.{solution}.{ingress_domain}"
        else:
            domain = f"{environment}.{solution}.local"
        
        return {
            'spec': complete_spec,
            'solution': solution,
            'environment': environment,
            'namespace_name': namespace_name,
            'securenamespace_name': securenamespace_name,
            'operator_namespace': OPERATOR_NAMESPACE,
            'revision': revision,
            'labels': common_labels,
            'annotations': common_annotations,
            'domain': domain,
        }

