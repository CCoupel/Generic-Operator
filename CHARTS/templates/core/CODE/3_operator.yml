    #!/usr/bin/env python3
    """
    Configuration globale de l'opérateur
    """
    import os

    LOG_LEVEL = os.getenv('LOG_LEVEL', 'INFO')

    # Namespace de l'opérateur
    OPERATOR_NAMESPACE = os.getenv('OPERATOR_NAMESPACE', 'namespace-operator')

    # CRD piloté par le moteur générique (voir values.yaml::crd) — jamais de group/version/plural
    # en dur ailleurs dans le code, toujours importer ces constantes depuis config.py
    CRD_GROUP = os.getenv('CRD_GROUP', 'secure-ns.example.com')
    CRD_VERSION = os.getenv('CRD_VERSION', 'v1alpha1')
    CRD_PLURAL = os.getenv('CRD_PLURAL', 'securenamespaces')

    # Intervalle de réconciliation périodique (en secondes)
    # Configurable via variable d'environnement RECONCILE_INTERVAL_SECONDS
    # Par défaut: 300 secondes (5 minutes)
    RECONCILE_INTERVAL_SECONDS = int(os.getenv('RECONCILE_INTERVAL_SECONDS', '300'))

    # Délai initial avant la première réconciliation périodique (en secondes)
    # Laisse le temps au create handler de terminer avant le premier tick
    RECONCILE_INITIAL_DELAY_SECONDS = int(os.getenv('RECONCILE_INITIAL_DELAY_SECONDS', '60'))

