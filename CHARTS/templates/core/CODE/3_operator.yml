    #!/usr/bin/env python3
    """
    Gestionnaire de ressources Kubernetes
    Application et suppression génériques
    """
    import logging
    import yaml
    import kubernetes
    import kubernetes.dynamic
    from config import CRD_GROUP, CRD_VERSION, CRD_PLURAL

    logger = logging.getLogger(__name__)


    def apply_resource(api_client, resource, securenamespace_name=None, securenamespace_uid=None, logger_obj=None):
        """
        Applique une ressource Kubernetes (create ou update) de manière générique
        """
        try:
            kind = resource.get('kind')
            api_version = resource.get('apiVersion', 'v1')
            metadata = resource.get('metadata', {})
            name = metadata.get('name')
            namespace = metadata.get('namespace')

            if not kind or not name:
                if logger_obj:
                    logger_obj.warning(f"Ressource invalide: kind={kind}, name={name}")
                return False

            if '_action' in resource:
                del resource['_action']

            if securenamespace_uid and securenamespace_name and kind != 'Namespace':
                from crd_manager import get_owner_references
                if 'ownerReferences' not in metadata:
                    metadata['ownerReferences'] = []

                owner_exists = any(
                    ref.get('uid') == securenamespace_uid
                    for ref in metadata.get('ownerReferences', [])
                )

                if not owner_exists:
                    owner_refs = get_owner_references(securenamespace_name, securenamespace_uid)
                    if owner_refs:
                        metadata['ownerReferences'] = owner_refs
                        resource['metadata'] = metadata

            dyn_client = kubernetes.dynamic.DynamicClient(api_client)
            api_resource = dyn_client.resources.get(api_version=api_version, kind=kind)
            is_namespaced = api_resource.namespaced

            try:
                if is_namespaced:
                    api_resource.patch(body=resource, name=name, namespace=namespace, content_type='application/merge-patch+json')
                else:
                    api_resource.patch(body=resource, name=name, content_type='application/merge-patch+json')
                if logger_obj:
                    logger_obj.debug(f"Ressource appliquée (patch): {api_version}/{kind}/{name}")

            except kubernetes.dynamic.exceptions.NotFoundError:
                if is_namespaced:
                    api_resource.create(body=resource, namespace=namespace)
                else:
                    api_resource.create(body=resource)
                if logger_obj:
                    logger_obj.debug(f"Ressource créée: {api_version}/{kind}/{name}")

            return True

        except Exception as e:
            if logger_obj:
                logger_obj.error(f"Erreur lors de l'application de {resource.get('kind')}/{resource.get('metadata', {}).get('name')}: {e}")
            raise


    def delete_resource(api_client, resource, logger_obj=None):
        """
        Supprime une ressource Kubernetes de manière générique
        """
        try:
            dyn_client = kubernetes.dynamic.DynamicClient(api_client)

            kind = resource.get('kind')
            api_version = resource.get('apiVersion', 'v1')
            metadata = resource.get('metadata', {})
            name = metadata.get('name')
            namespace = metadata.get('namespace')

            if not kind or not name:
                if logger_obj:
                    logger_obj.warning(f"Ressource invalide pour suppression: kind={kind}, name={name}")
                return False

            try:
                api_resource = dyn_client.resources.get(api_version=api_version, kind=kind)
            except Exception as e:
                if logger_obj:
                    logger_obj.warning(f"Impossible de trouver la ressource {api_version}/{kind}: {e}")
                return False

            is_namespaced = api_resource.namespaced

            if logger_obj:
                logger_obj.info(f"Suppression de {api_version}/{kind}/{name}")

            try:
                if is_namespaced:
                    api_resource.delete(name=name, namespace=namespace)
                else:
                    api_resource.delete(name=name)
                if logger_obj:
                    logger_obj.debug(f"Ressource supprimée: {api_version}/{kind}/{name}")
                return True

            except kubernetes.dynamic.exceptions.NotFoundError:
                if logger_obj:
                    logger_obj.info(f"Ressource déjà supprimée: {api_version}/{kind}/{name}")
                return True

        except Exception as e:
            if logger_obj:
                logger_obj.error(f"Erreur lors de la suppression de {resource.get('kind')}/{resource.get('metadata', {}).get('name')}: {e}")
            raise


    def create_resources_from_templates(api_client, spec, securenamespace_name):
        """
        Crée toutes les ressources définies dans les templates
        """
        from datetime import datetime
        from template_manager import load_templates, load_templates_order, render_template, get_template_values
        from revision_manager import get_revision_number
        from crd_manager import extract_namespace_info

        solution, environment, namespace_name = extract_namespace_info(spec)
        revision = get_revision_number(api_client, securenamespace_name)

        logger.info(f"📦 Création des ressources pour le namespace: {namespace_name}")
        logger.info(f"   SecureNamespace: {securenamespace_name}")
        logger.info(f"   Révision: {revision}")

        custom_api = kubernetes.client.CustomObjectsApi(api_client)
        try:
            resource = custom_api.get_cluster_custom_object(
                group=CRD_GROUP,
                version=CRD_VERSION,
                plural=CRD_PLURAL,
                name=securenamespace_name
            )
            securenamespace_uid = resource.get('metadata', {}).get('uid', '')
        except Exception as e:
            logger.warning(f"Impossible de récupérer l'UID du SecureNamespace: {e}")
            securenamespace_uid = ''

        templates_to_apply = load_templates_order()
        if not templates_to_apply:
            logger.error("❌ Aucun template à appliquer (ordre vide)")
            return {'created': [], 'failed': [], 'succeeded': 0, 'failed_count': 0, 'total': 0}

        templates = load_templates(templates_to_apply)
        if not templates:
            logger.error("❌ Aucun template chargé")
            return {'created': [], 'failed': [], 'succeeded': 0, 'failed_count': 0, 'total': 0}

        template_values = get_template_values(spec, securenamespace_name, revision)

        created_resources = []
        failed_resources = []

        for template_key in templates_to_apply:
            try:
                logger.info(f"   📄 Traitement du template: {template_key}")

                if template_key not in templates:
                    logger.warning(f"   ⚠️  Template '{template_key}' non trouvé")
                    failed_resources.append({'template': template_key, 'reason': 'Template not found', 'timestamp': datetime.utcnow().isoformat() + 'Z'})
                    continue

                template_content = templates[template_key]

                if not template_content or not isinstance(template_content, str):
                    logger.warning(f"   ⚠️  Contenu invalide pour '{template_key}'")
                    failed_resources.append({'template': template_key, 'reason': 'Invalid content', 'timestamp': datetime.utcnow().isoformat() + 'Z'})
                    continue

                rendered = render_template(template_content, template_values)
                documents = list(yaml.safe_load_all(rendered))

                for doc in documents:
                    if not doc:
                        continue

                    if doc.get('_action') == 'delete':
                        try:
                            delete_resource(api_client, doc, logger_obj=logger)
                        except Exception as e:
                            logger.error(f"   ❌ Erreur suppression de {doc.get('kind')}/{doc.get('metadata', {}).get('name')}: {e}")
                            failed_resources.append({
                                'kind': doc.get('kind'),
                                'name': doc.get('metadata', {}).get('name'),
                                'action': 'delete',
                                'reason': str(e),
                                'timestamp': datetime.utcnow().isoformat() + 'Z'
                            })
                        continue

                    if 'metadata' not in doc:
                        doc['metadata'] = {}
                    if 'labels' not in doc['metadata']:
                        doc['metadata']['labels'] = {}
                    if 'annotations' not in doc['metadata']:
                        doc['metadata']['annotations'] = {}

                    doc['metadata']['labels'].update(template_values['labels'])
                    doc['metadata']['annotations'].update(template_values['annotations'])

                    try:
                        apply_resource(api_client, doc, securenamespace_name, securenamespace_uid, logger_obj=logger)
                        resource_key = f"{doc.get('apiVersion', 'v1')}/{doc['kind']}/{doc['metadata']['name']}"
                        created_resources.append(resource_key)
                        logger.info(f"      ✅ {resource_key}")

                    except Exception as e:
                        logger.error(f"      ❌ Erreur: {e}")
                        failed_resources.append({
                            'kind': doc.get('kind'),
                            'name': doc.get('metadata', {}).get('name'),
                            'reason': str(e),
                            'timestamp': datetime.utcnow().isoformat() + 'Z'
                        })

            except Exception as e:
                logger.error(f"   ❌ Erreur avec '{template_key}': {e}")
                import traceback
                logger.error(traceback.format_exc())
                failed_resources.append({'template': template_key, 'reason': str(e), 'timestamp': datetime.utcnow().isoformat() + 'Z'})
                continue

        success_count = len(created_resources)
        failure_count = len(failed_resources)
        total = success_count + failure_count

        logger.info(f"✅ {success_count}/{total} ressources créées/mises à jour")
        if failure_count > 0:
            logger.warning(f"❌ {failure_count} erreur(s) rencontrée(s)")

        return {
            'created': created_resources,
            'failed': failed_resources,
            'succeeded': success_count,
            'failed_count': failure_count,
            'total': total
        }

