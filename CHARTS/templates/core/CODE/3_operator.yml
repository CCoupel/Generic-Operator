    #!/usr/bin/env python3
    """
    Handlers Kopf pour les événements SecureNamespace
    """

    import kopf
    import kubernetes
    import logging
    from config import RECONCILE_INTERVAL_SECONDS, RECONCILE_INITIAL_DELAY_SECONDS
    from config import CRD_GROUP, CRD_VERSION, CRD_PLURAL

    logger = logging.getLogger(__name__)


    @kopf.on.create(CRD_GROUP, CRD_VERSION, CRD_PLURAL)
    def create_secure_namespace(spec, name, namespace, logger, **kwargs):
        """
        Appelé lors de la création d'une ressource SecureNamespace
        """
        from crd_manager import extract_namespace_info
        from resource_manager import create_resources_from_templates
        from revision_manager import add_history_entry_to_configmap

        solution, environment, namespace_name = extract_namespace_info(spec)

        logger.info(f"🚀 CRÉATION du namespace sécurisé")
        logger.info(f"   SecureNamespace: {name}")
        logger.info(f"   Namespace K8s: {namespace_name}")

        try:
            api_client = kubernetes.client.ApiClient()
            custom_api = kubernetes.client.CustomObjectsApi(api_client)

            resource = custom_api.get_cluster_custom_object(
                group=CRD_GROUP,
                version=CRD_VERSION,
                plural=CRD_PLURAL,
                name=name
            )
            sns_uid = resource.get('metadata', {}).get('uid', '')

            patch_annotations = {
                'metadata': {
                    'annotations': {
                        f'{CRD_GROUP}/revision': '1',
                    }
                }
            }

            custom_api.patch_cluster_custom_object(
                group=CRD_GROUP,
                version=CRD_VERSION,
                plural=CRD_PLURAL,
                name=name,
                body=patch_annotations
            )
            logger.info(f"📊 Révision initialisée à 1")

            result = create_resources_from_templates(api_client, spec, name)

            creation_diff = [('add', ('spec',), 'SecureNamespace created')]
            add_history_entry_to_configmap(
                api_client,
                name,
                sns_uid,
                creation_diff,
                1,
                spec_data=spec,
                status=result,
                logger_obj=logger
            )

            logger.info(f"✅ Namespace {namespace_name} créé avec succès")

            return {
                'namespaceName': namespace_name,
                'secureNamespace': name,
                'solution': solution,
                'environment': environment,
                'state': 'Ready',
                'message': f'Namespace créé ({result["succeeded"]} réussi, {result["failed_count"]} erreur)',
                'createdResources': result['created'],
                'failedResources': result['failed']
            }

        except Exception as e:
            logger.error(f"❌ Erreur lors de la création: {e}")
            import traceback
            logger.error(traceback.format_exc())
            raise kopf.PermanentError(f"Impossible de créer le namespace: {e}")


    @kopf.on.update(CRD_GROUP, CRD_VERSION, CRD_PLURAL, field='spec')
    def update_secure_namespace(spec, name, namespace, old, new, diff, logger, **kwargs):
        """
        Appelé UNIQUEMENT lors du changement de spec
        """
        from crd_manager import extract_namespace_info
        from resource_manager import create_resources_from_templates
        from revision_manager import add_history_entry_to_configmap

        solution, environment, namespace_name = extract_namespace_info(spec)

        logger.info(f"🔄 MISE À JOUR du namespace sécurisé")
        logger.info(f"   SecureNamespace: {name}")
        logger.info(f"   Namespace K8s: {namespace_name}")
        logger.info(f"   Changements: {len(diff)} modification(s)")

        for change in diff:
            logger.info(f"      Diff: {change}")

        try:
            if not diff or len(diff) == 0:
                logger.info("✅ Aucun changement dans le spec")
                return

            logger.info("🔄 Le spec a changé, mise à jour en cours")

            api_client = kubernetes.client.ApiClient()
            custom_api = kubernetes.client.CustomObjectsApi(api_client)

            resource = custom_api.get_cluster_custom_object(
                group=CRD_GROUP,
                version=CRD_VERSION,
                plural=CRD_PLURAL,
                name=name
            )

            sns_uid = resource.get('metadata', {}).get('uid', '')
            current_revision = int(resource.get('metadata', {}).get('annotations', {}).get(f'{CRD_GROUP}/revision', '0'))
            new_revision = current_revision + 1

            logger.info(f"📊 Révision: {current_revision} → {new_revision}")

            patch_revision = {
                'metadata': {
                    'annotations': {
                        f'{CRD_GROUP}/revision': str(new_revision),
                    }
                }
            }

            custom_api.patch_cluster_custom_object(
                group=CRD_GROUP,
                version=CRD_VERSION,
                plural=CRD_PLURAL,
                name=name,
                body=patch_revision
            )

            result = create_resources_from_templates(api_client, spec, name)

            add_history_entry_to_configmap(
                api_client,
                name,
                sns_uid,
                diff,
                new_revision,
                spec_data=spec,
                status=result,
                logger_obj=logger
            )

            logger.info(f"✅ Namespace {namespace_name} mis à jour avec succès")
            logger.info(f"Résultat: {result['succeeded']} réussi(s); {result['failed_count']} erreur(s)")

            return {
                'namespaceName': namespace_name,
                'secureNamespace': name,
                'state': 'Ready',
                'message': f"Namespace mis à jour ({result['succeeded']} réussi, {result['failed_count']} erreur)",
                'updatedResources': result['created'],
                'failedResources': result['failed']
            }

        except Exception as e:
            logger.error(f"❌ Erreur lors de la mise à jour: {e}")
            import traceback
            logger.error(traceback.format_exc())
            raise kopf.PermanentError(f"Impossible de mettre à jour le namespace: {e}")


    @kopf.on.timer(
        CRD_GROUP, CRD_VERSION, CRD_PLURAL,
        interval=RECONCILE_INTERVAL_SECONDS,
        initial_delay=RECONCILE_INITIAL_DELAY_SECONDS,
        idle=RECONCILE_INTERVAL_SECONDS
    )
    def reconcile_secure_namespace(spec, name, namespace, logger, **kwargs):
        """
        Réconciliation périodique pour corriger toute dérive (drift).

        Ce handler est exécuté automatiquement par Kopf à intervalle régulier
        pour CHAQUE ressource SecureNamespace existante.

        Il réapplique tous les templates, ce qui permet de :
        - Recréer des ressources supprimées manuellement
        - Corriger des modifications manuelles non conformes
        - Garantir la convergence vers l'état désiré

        Comme apply_resource utilise patch (idempotent), les ressources
        déjà conformes ne sont pas modifiées inutilement.
        """
        from crd_manager import extract_namespace_info
        from resource_manager import create_resources_from_templates

        solution, environment, namespace_name = extract_namespace_info(spec)

        logger.info(f"🔄 RÉCONCILIATION PÉRIODIQUE pour {name}")
        logger.info(f"   Namespace K8s: {namespace_name}")
        logger.info(f"   Intervalle: {RECONCILE_INTERVAL_SECONDS}s")

        try:
            api_client = kubernetes.client.ApiClient()

            result = create_resources_from_templates(api_client, spec, name)

            if result['failed_count'] > 0:
                logger.warning(
                    f"⚠️  Réconciliation terminée avec erreurs: "
                    f"{result['succeeded']} réussi(s), {result['failed_count']} erreur(s)"
                )
                for failure in result['failed']:
                    logger.warning(f"   ❌ {failure.get('kind', 'N/A')}/{failure.get('name', 'N/A')}: {failure.get('reason', 'N/A')}")
            else:
                logger.info(
                    f"✅ Réconciliation terminée: {result['succeeded']} ressource(s) synchronisée(s)"
                )

        except Exception as e:
            logger.error(f"❌ Erreur lors de la réconciliation périodique: {e}")
            import traceback
            logger.error(traceback.format_exc())
            raise kopf.TemporaryError(
                f"Réconciliation échouée, nouvelle tentative dans {RECONCILE_INTERVAL_SECONDS}s: {e}",
                delay=RECONCILE_INTERVAL_SECONDS
            )


    @kopf.on.delete(CRD_GROUP, CRD_VERSION, CRD_PLURAL)
    def delete_secure_namespace(spec, name, status, logger, **kwargs):
        """
        Appelé quand une ressource SecureNamespace est supprimée
        """
        from crd_manager import extract_namespace_info
        from revision_manager import add_history_entry_to_configmap

        solution, environment, namespace_name = extract_namespace_info(spec)

        logger.info(f"🗑️  SUPPRESSION du namespace: {namespace_name}")

        try:
            api_client = kubernetes.client.ApiClient()
            custom_api = kubernetes.client.CustomObjectsApi(api_client)

            try:
                resource = custom_api.get_cluster_custom_object(
                    group=CRD_GROUP,
                    version=CRD_VERSION,
                    plural=CRD_PLURAL,
                    name=name
                )
                sns_uid = resource.get('metadata', {}).get('uid', '')
                current_revision = int(resource.get('metadata', {}).get('annotations', {}).get(f'{CRD_GROUP}/revision', '1'))
            except Exception:
                sns_uid = ''
                current_revision = 1

            deletion_diff = [('remove', ('spec',), 'SecureNamespace deleted')]
            add_history_entry_to_configmap(
                api_client,
                name,
                sns_uid,
                deletion_diff,
                current_revision + 1,
                spec_data={'status': 'deleted'},
                logger_obj=logger
            )

            logger.info(f"📝 Suppression enregistrée dans l'historique")

            dyn_client = kubernetes.dynamic.DynamicClient(api_client)

            try:
                ns_api = dyn_client.resources.get(api_version='v1', kind='Namespace')
                ns_api.delete(name=namespace_name)
                logger.info(f"✅ Namespace {namespace_name} supprimé")
            except Exception as e:
                if "not found" not in str(e).lower():
                    logger.warning(f"⚠️  Erreur suppression namespace: {e}")

            from config import OPERATOR_NAMESPACE
            logger.info(f"✅ Ressources supprimées, historique conservé dans {OPERATOR_NAMESPACE}/{name}-history")

        except Exception as e:
            logger.error(f"❌ Erreur lors de la suppression: {e}")
            logger.warning(f"⚠️  Suppression partielle, finalizer retiré quand même")

